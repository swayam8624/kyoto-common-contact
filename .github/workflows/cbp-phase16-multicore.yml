name: CBP Phase 16 — true multicore exact spatial-cell pressure
on:
  push:
    branches:
      - research/common-broadphase-orchestrator
    paths:
      - '.github/workflows/cbp-phase16-multicore.yml'
      - 'include/ccp/cbp_pressure_incremental_flat.hpp'
      - 'apps/cbp_pressure_incremental_flat_cpu.cpp'
      - 'tests/cbp_pressure_incremental_flat_tests.cpp'
      - 'scripts/test_cbp_pressure_parallel.py'
      - 'scripts/analyze_cbp_pressure_parallel.py'
      - 'CMakeLists.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-parallel:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Build exact serial/parallel current AABB broad phases
        run: |
          cmake --preset kyoto-final-cpu
          cmake --build build/kyoto-final-cpu \
            --target ccp_cbp_pressure_cpu ccp_cbp_pressure_incremental_flat_cpu \
                     ccp_cbp_pressure_incremental_flat_tests --parallel 2
          python3 -m py_compile scripts/test_cbp_pressure_parallel.py scripts/analyze_cbp_pressure_parallel.py
      - name: Verify 512-body brute and 65K/16K multi-frame independent hash oracle
        run: |
          ctest --test-dir build/kyoto-final-cpu \
            -R '^cbp_(flat_persistent_cell_direct_oracle|flat_persistent_parallel_independent_oracle)$' \
            --output-on-failure
      - name: Measure 1M slabs, 6 frames, CPU serial / 4 thread / frozen grid
        timeout-minutes: 4
        run: |
          mkdir -p build/phase16-measurements
          build/kyoto-final-cpu/ccp_cbp_pressure_incremental_flat_cpu \
            build/phase16-measurements/slabs-serial.csv \
            slabs 1000000 6 95377 300000000 25000 12000000 --threads 1
          build/kyoto-final-cpu/ccp_cbp_pressure_incremental_flat_cpu \
            build/phase16-measurements/slabs-parallel.csv \
            slabs 1000000 6 95377 300000000 25000 12000000 --threads 4
          build/kyoto-final-cpu/ccp_cbp_pressure_cpu \
            build/phase16-measurements/slabs-frozen.csv \
            slabs 1000000 6 95377 300000000 25000 12000000
          python3 scripts/analyze_cbp_pressure_parallel.py \
            build/phase16-measurements/slabs-serial.csv \
            build/phase16-measurements/slabs-parallel.csv \
            build/phase16-measurements/slabs-frozen.csv \
            --report build/phase16-measurements/slabs-REPORT.md
      - name: Measure 1M burst, 20 frames, dense candidate count and exact hash
        timeout-minutes: 8
        run: |
          build/kyoto-final-cpu/ccp_cbp_pressure_incremental_flat_cpu \
            build/phase16-measurements/burst-serial.csv \
            burst 1000000 20 95377 300000000 25000 12000000 --threads 1
          build/kyoto-final-cpu/ccp_cbp_pressure_incremental_flat_cpu \
            build/phase16-measurements/burst-parallel.csv \
            burst 1000000 20 95377 300000000 25000 12000000 --threads 4
          build/kyoto-final-cpu/ccp_cbp_pressure_cpu \
            build/phase16-measurements/burst-frozen.csv \
            burst 1000000 20 95377 300000000 25000 12000000
          python3 scripts/analyze_cbp_pressure_parallel.py \
            build/phase16-measurements/burst-serial.csv \
            build/phase16-measurements/burst-parallel.csv \
            build/phase16-measurements/burst-frozen.csv \
            --report build/phase16-measurements/burst-REPORT.md
      - name: Verify real parallel execution and full framewise parity without assuming speedup
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          p=Path("build/phase16-measurements")
          for scene in ("slabs","burst"):
              with (p/(scene+"-parallel.csv")).open() as f:
                  rows=list(csv.DictReader(f))
              assert all(x["status"]=="complete" for x in rows)
              assert any(int(x["workers_used"])>=2 for x in rows)
              assert all(x["selected_backend"]=="persistent_flat_parallel_3d_grid" for x in rows)
              assert all(float(x["complete_query_ms"])>=float(x["query_ms"]) for x in rows)
              print("PASS observed real threaded CPU exact frames:",scene,len(rows))
          PY
      - name: Preserve serial, parallel and independently verified work evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbp-phase16-1m-exact-threaded-cell-research
          path: build/phase16-measurements
          retention-days: 14
          if-no-files-found: warn

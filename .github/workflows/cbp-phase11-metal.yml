name: CBP Phase 11 — compile and if available execute real Apple Metal global pressure
on:
  push:
    branches:
      - research/common-broadphase-orchestrator
    paths:
      - 'apps/cbp_pressure_metal.mm'
      - 'include/ccp/cbp_pressure.hpp'
      - 'CMakeLists.txt'
      - '.github/workflows/cbp-phase11-metal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metal:
    runs-on: macos-15
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Ensure CMake macOS native GLFW dependency
        run: |
          brew list glfw >/dev/null 2>&1 || brew install glfw
      - name: Build C++ CPU and REAL Metal compute kernels
        run: |
          cmake -S . -B build/phase11-macos \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCCP_REQUIRE_BULLET=OFF
          cmake --build build/phase11-macos \
            --target ccp_cbp_pressure_metal ccp_cbp_pressure_cpu --parallel 2
      - name: Validate real Metal device, or explicitly skip virtualized runner
        timeout-minutes: 3
        run: |
          mkdir -p build/phase11-metal-evidence
          if system_profiler SPDisplaysDataType | grep -iq 'Metal Support'; then
            echo "Metal-capable reported GPU"
            build/phase11-macos/ccp_cbp_pressure_metal \
              build/phase11-metal-evidence/grid-1024.csv \
              burst 1024 3 61749 grid 30000000 10000 1000000 256
            build/phase11-macos/ccp_cbp_pressure_metal \
              build/phase11-metal-evidence/brute-1024.csv \
              burst 1024 3 61749 exhaustive 30000000 10000 1000000 256
            python3 - <<'PY'
          import csv
          from pathlib import Path
          for mode in ('grid','brute'):
              p=Path('build/phase11-metal-evidence')/(mode+'-1024.csv')
              rows=list(csv.DictReader(p.open()))
              assert len(rows)==3 and all(r['status']=='COMPLETE' for r in rows)
              assert all(r['validation']=='GPU_CPU_SMALL_BRUTE' for r in rows)
              print('PASS actual Metal 3D',mode,'full count+hash oracle')
          PY
          else
            echo 'SKIP: GitHub-hosted macOS runner did not expose Metal Support. Compilation remains tested.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbp-phase11-mac-native-metal-compilation-and-optional-real-device-results
          path: build/phase11-metal-evidence/*.csv
          retention-days: 14
          if-no-files-found: warn

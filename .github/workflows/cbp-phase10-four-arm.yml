name: CBP Phase 10 — exact causal four-arm on-policy portfolio and real-GLB counterfactual
on:
  push:
    branches:
      - research/common-broadphase-orchestrator
    paths:
      - '.github/workflows/cbp-phase10-four-arm.yml'
      - 'include/ccp/cbp_portfolio_v2.hpp'
      - 'apps/cbp_portfolio_v2_replay.cpp'
      - 'tests/cbp_portfolio_v2_tests.cpp'
      - 'scripts/analyze_cbp_portfolio_v2.py'
      - 'CMakeLists.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Compile legacy and new portfolio without changing legacy targets
        run: |
          cmake --preset kyoto-final-cpu
          cmake --build build/kyoto-final-cpu \
            --target ccp_cbp_portfolio_v2_tests ccp_cbp_portfolio_v2_replay \
                     ccp_cbp_portfolio_tests ccp_cbp_mass_export ccp_cbp_mass_replay \
            --parallel 2
      - name: Independent brute-force exact oracle and baseline regression
        run: |
          ctest --test-dir build/kyoto-final-cpu \
            -R '^cbp_(four_arm_portfolio_oracle|portfolio_fallback_oracle)$' \
            --output-on-failure
      - name: Run 120 genuine executed four-arm causal choices on a small physics-derived mass scene
        run: |
          build/kyoto-final-cpu/ccp_cbp_mass_export \
            build/phase10-small-scene 12 120 61421 crowded
          build/kyoto-final-cpu/ccp_cbp_mass_replay \
            build/phase10-small-scene/snapshots.kmcb \
            build/phase10-small-scene/instances.csv \
            build/phase10-small-scene/cpu-core.csv core
          build/kyoto-final-cpu/ccp_cbp_portfolio_v2_replay \
            build/phase10-small-scene/snapshots.kmcb \
            build/phase10-small-scene/instances.csv \
            build/phase10-small-scene/portfolio-v2.csv
          python3 scripts/analyze_cbp_portfolio_v2.py \
            build/phase10-small-scene/portfolio-v2.csv \
            build/phase10-small-scene/cpu-core.csv \
            --report build/phase10-small-scene/FOUR-ARM-RESULTS.md
      - name: Download 26 license-audited pinned real GLB originals
        timeout-minutes: 7
        run: |
          python3 scripts/download_cbp_gltf_scenes.py \
            --output build/phase10-real-assets --limit 26 \
            --per-asset-mb 24 --total-mb 280
      - name: Held-out real 25-source-model 120-frame 1024-collider tour
        timeout-minutes: 6
        run: |
          python3 scripts/import_cbp_gltf_scenes.py \
            --catalog build/phase10-real-assets \
            --output build/phase10-real-scene \
            --frames 120 --seed 94681 --layout wave \
            --max-triangles-per-asset 1024 \
            --max-visual-triangles-per-asset 3072
          build/kyoto-final-cpu/ccp_cbp_mass_replay \
            build/phase10-real-scene/snapshots.kmcb \
            build/phase10-real-scene/instances.csv \
            build/phase10-real-scene/cpu-core.csv core
          build/kyoto-final-cpu/ccp_cbp_portfolio_v2_replay \
            build/phase10-real-scene/snapshots.kmcb \
            build/phase10-real-scene/instances.csv \
            build/phase10-real-scene/portfolio-v2.csv
          python3 scripts/analyze_cbp_portfolio_v2.py \
            build/phase10-real-scene/portfolio-v2.csv \
            build/phase10-real-scene/cpu-core.csv \
            --report build/phase10-real-scene/FOUR-ARM-RESULTS.md
      - name: Keep full independent method traces and exact audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbp-phase10-four-arm-causal-research
          path: |
            build/phase10-small-scene/portfolio-v2.csv
            build/phase10-small-scene/FOUR-ARM-RESULTS.md
            build/phase10-real-scene/portfolio-v2.csv
            build/phase10-real-scene/cpu-core.csv
            build/phase10-real-scene/FOUR-ARM-RESULTS.md
            build/phase10-real-scene/frames.csv
            build/phase10-real-scene/instances.csv
          retention-days: 14
          if-no-files-found: warn

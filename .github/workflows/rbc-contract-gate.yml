name: RBC first-principles exact contract and existing regression
on:
  push:
    branches:
      - research/reach-budget-calculus
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rbc-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Record frozen V4 unchanged against original archive branch
        run: |
          git fetch origin research/kyoto-decision-coverage:refs/remotes/origin/research/kyoto-decision-coverage
          git diff --exit-code origin/research/kyoto-decision-coverage -- include/ccp/final_broadphase.hpp
      - name: Configure and compile full existing C++23 CPU project
        run: |
          cmake -S . -B build/rbc-ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/rbc-ci --parallel 3
      - name: Run full CTest regression including new RBC exact oracle
        run: ctest --test-dir build/rbc-ci --output-on-failure
      - name: Recheck RBC with Clang address/undefined sanitizers
        run: |
          clang++ -std=c++23 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Iinclude tests/rbc_reach_budget_tests.cpp -o build/rbc-sanitized
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./build/rbc-sanitized
          clang++ -std=c++23 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Iinclude tests/rbc_margin_model_tests.cpp -o build/rbc-model-sanitized
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./build/rbc-model-sanitized
          clang++ -std=c++23 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Iinclude tests/rbc_swept_reach_tests.cpp -o build/rbc-swept-sanitized
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./build/rbc-swept-sanitized
      - name: All Python files still parse
        run: python3 -m compileall -q scripts benchmarks tests

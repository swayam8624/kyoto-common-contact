name: Kyoto contact geometry and visual evidence
on:
  push:
    branches:
      - research/spacetime-contact-atlas
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.type }}
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
  visual-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile native C++ trace exporter
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
      - name: Export exact native kinematic trace
        run: ./build/kyoto_motion_export results/motion-lab
      - name: Install scientific figure dependencies
        run: python -m pip install numpy==2.2.6 matplotlib==3.10.7 plotly==6.3.1 pandas==2.3.3 pillow==12.0.0
      - name: Build science figures and offline interactive 3D
        run: |
          python scripts/render_motion_lab.py --data results/motion-lab --output results/motion-lab/visuals
          python scripts/export_paraview_motion.py --data results/motion-lab --output results/motion-lab/vtk
      - name: Independent deliverable sanity check
        run: |
          python - <<'PY'
          import csv, pathlib, json
          root = pathlib.Path("results/motion-lab")
          d = json.loads((root/"manifest.json").read_text())
          assert d["frames"] == 121 and d["independent_sap_parity"]
          assert len(list(csv.DictReader((root/"trajectory.csv").open()))) == 726
          assert len(list((root/"vtk").glob("*.vtk"))) == 121
          assert len(list((root/"visuals").glob("*.png"))) == 4
          assert (root/"visuals"/"05_interactive_motion_lab.html").stat().st_size > 100000
          print("PASS: native trajectory, 4 scientific figures, interactive 3D, 121 VTK frames")
          PY
      - name: Run analytical Stage-2 contact experiment
        run: ./build/kyoto_temporal_experiment results/temporal-study
      - name: Generate Stage-2 scientific figures and interactive 3D
        run: python scripts/render_temporal_study.py --input results/temporal-study --output results/temporal-study/visuals
      - name: Validate Stage-2 evidence and image count
        run: |
          python - <<'PY'
          import csv, pathlib, json
          p=pathlib.Path("results/temporal-study")
          rows=list(csv.DictReader((p/"temporal_analytical_study.csv").open()))
          assert len(rows)==120
          assert all(int(x["missed_true"])==0 for x in rows)
          assert len(list((p/"visuals").glob("[0-9][0-9]_*.png")))==6
          assert (p/"visuals"/"STAGE2_SCIENTIFIC_ATLAS.png").stat().st_size>100000
          assert (p/"visuals"/"07_interactive_spacetime_observatory.html").stat().st_size>100000
          print("PASS: full native experiment, 120 rows, 6 figures, interactive observatory")
          PY
      - name: Generate native 3D mesh feature trajectories and candidates
        run: ./build/kyoto_feature_scene results/feature-scene
      - name: Render 3D shell/cage atlas and ParaView time series
        run: python scripts/render_feature_scene.py --input results/feature-scene --output results/feature-scene/visuals
      - name: Audit Stage-3 scene outputs
        run: |
          python - <<'PY'
          import csv, json, pathlib
          p=pathlib.Path("results/feature-scene")
          m=json.loads((p/"scene_manifest.json").read_text())
          assert (m["vertex_count"],m["face_count"],m["edge_count"])==(420,836,1254)
          assert m["frames"]==61 and not m["continuous_CCD"]
          state=list(csv.DictReader((p/"mesh_states.csv").open()))
          assert len(state)==61*420
          timeline=list(csv.DictReader((p/"frame_metrics.csv").open()))
          assert len(timeline)==61
          assert len(list((p/"visuals").glob("[0-9][0-9]_*.png")))==5
          assert len(list((p/"visuals"/"vtk").glob("*.vtk")))==61
          assert (p/"visuals"/"06_interactive_mesh_3d.html").stat().st_size>100000
          assert (p/"visuals"/"STAGE3_MESH_FEATURE_ATLAS.png").stat().st_size>100000
          print("PASS: 3D topological mesh scene, 61 states, canonical typed candidates, 5 scientific figures, interactive replay and VTK")
          PY
      - name: Export actual integrated volumetric FEM collision dynamics
        run: ./build/kyoto_solid_simulation results/solid-fem
      - name: Render scientific real-physics atlas and 3D volumetric series
        run: python scripts/render_solid_fem.py --input results/solid-fem --output results/solid-fem/visuals
      - name: Audit Stage-5 actual physical integration and output
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, json
          root=Path("results/solid-fem")
          m=json.loads((root/"solid_manifest.json").read_text())
          assert m["rendered_states_are_solver_generated"]
          assert not m["general_mesh_ccd"] and not m["upstream_IPC_integration_for_solver"]
          assert (m["vertices"],m["tetrahedra"],m["frames"])==(180,480,181)
          assert m["impact_events"]>0 and m["minimum_tetra_jacobian"]>0
          rows=list(csv.DictReader((root/"solid_metrics.csv").open()))
          assert len(rows)==181
          assert all(float(x["min_height_m"])>=-1e-11 for x in rows)
          assert all(float(x["min_tetra_jacobian"])>0 for x in rows)
          assert len(list((root/"visuals").glob("[0-9][0-9]_*.png")))==6
          assert len(list((root/"visuals"/"vtk_tetrahedra").glob("*.vtk")))==181
          assert (root/"visuals"/"STAGE5_ACTUAL_PHYSICS_ATLAS.png").stat().st_size>100000
          assert (root/"visuals"/"07_interactive_physically_integrated_solid.html").stat().st_size>100000
          print("PASS: 900-step actual 3D elastic FEM, 181 original states, real impact events, 6 figures, 181 volumetric tetra snapshots")
          PY
      - name: Export real curved-obstacle 3D elastic FEM
        run: ./build/kyoto_curved_fem_export results/curved-fem
      - name: Derive curved-FEM scientific atlas and 3D volumetric playback
        run: python scripts/render_curved_fem.py --input results/curved-fem --output results/curved-fem/visuals
      - name: Audit full triangle-sphere safety results and evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,json,math
          root=Path("results/curved-fem")
          m=json.loads((root/"curved_manifest.json").read_text())
          assert m["physical_motion"]
          assert not m["full_triangle_sphere_safety"]
          assert not m["general_mesh_mesh_IPC_response"]
          assert (m["vertices"],m["tetrahedra"],m["frames"])==(180,480,181)
          assert m["normal_impulse_vertex_steps"]>0
          assert m["surface_audit_states"]==901
          assert m["states_with_vertex_inside_sphere"]==0
          records=list(csv.DictReader((root/"surface_sphere_clearance.csv").open()))
          assert len(records)==901
          assert all(int(x["tested_triangles"])==m["surface_triangles"] for x in records)
          assert all(float(x["minimum_vertex_clearance_m"])>=-2e-9 for x in records)
          assert sum(int(x["penetrating_triangles"])>0 for x in records)==m["states_with_static_triangle_sphere_overlap"]
          visual=root/"visuals"
          assert len(list(visual.glob("[0-9][0-9]_*.png")))==6
          assert len(list((visual/"vtk_volumetric").glob("curved_*.vtk")))==181
          assert (visual/"07_interactive_curved_fem.html").stat().st_size>100000
          assert (visual/"STAGE6_CURVED_FEM_SCIENCE_ATLAS.png").stat().st_size>100000
          print("PASS: actual 900-step curved 3D FEM with 901 independent triangle/vertex safety audit states; full-surface overlap count =",m["states_with_static_triangle_sphere_overlap"])
          PY
      - name: Export physically integrated whole-face-safe elastic 3D solid
        run: ./build/kyoto_whole_face_fem_export results/whole-face-fem
      - name: Render measured whole-face stress, impulse, continuous safety and 3D volumes
        run: python scripts/render_whole_face_fem.py --input results/whole-face-fem --output results/whole-face-fem/visuals
      - name: Independent complete audit of Stage-7 whole-face physical evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,csv,math
          p=Path("results/whole-face-fem")
          manifest=json.loads((p/"curved_manifest.json").read_text())
          assert manifest["physical_motion"]
          assert manifest["whole_triangle_lipschitz_CCD"]
          assert not manifest["general_mesh_mesh_IPC_response"]
          assert not manifest["machine_certified_rounded_intervals"]
          assert manifest["surface_audit_states"]==901
          assert manifest["states_with_vertex_inside_sphere"]==0
          assert manifest["states_with_static_triangle_sphere_overlap"]==0
          assert manifest["normal_impulse_vertex_steps"]>0
          assert manifest["minimum_element_jacobian"]>0
          a=list(csv.DictReader((p/"surface_sphere_clearance.csv").open()))
          assert len(a)==901
          assert all(int(x["penetrating_triangles"])==0 for x in a)
          assert all(float(x["minimum_triangle_clearance_m"])>=0 for x in a)
          fractions=list(csv.DictReader((p/"whole_face_contact_step_diagnostics.csv").open()))
          assert len(fractions)==900
          assert all(0<=float(x["accepted_global_fraction"])<=1 for x in fractions)
          assert sum(int(x["time_clipped"]) for x in fractions)==manifest["time_clipped_steps"]
          visuals=p/"visuals"
          assert len(list(visuals.glob("[0-9][0-9]_*.png")))==7
          assert len(list((visuals/"vtk_volumetric").glob("curved_*.vtk")))==181
          assert (visuals/"STAGE7_WHOLE_FACE_FEM_SCIENCE_ATLAS.png").stat().st_size>100000
          assert (visuals/"07_interactive_curved_fem.html").stat().st_size>100000
          print("PASS: full-face 0-penetration FEM, 901 source states, 900 paid contact traces, seven 3D/physics charts, 181 volumes")
          PY
      - name: Independent before-versus-after geometric safety and physics audit
        run: |
          python scripts/compare_curved_contact_solvers.py \
            --old results/curved-fem \
            --new results/whole-face-fem \
            --output results/whole-face-comparison
      - name: Verify completeness of BOTH original simulation trajectories
        run: |
          python - <<'PY'
          import json,pathlib,csv
          p=pathlib.Path("results/whole-face-comparison")
          d=json.loads((p/"comparison_summary.json").read_text())
          assert d["steps_each"]==900
          assert d["face_audit_states_each"]==901
          assert d["old_vertex_only_states_with_face_penetration"]==458
          assert d["new_whole_face_states_with_face_penetration"]==0
          assert d["new_vertex_inside_states"]==0
          assert d["new_time_clipped_steps"]>=0
          assert len(list(csv.DictReader((p/"full_901_state_contact_comparison.csv").open())))==901
          assert len(list(csv.DictReader((p/"trajectory_divergence.csv").open())))==181
          assert len(list(p.glob("[0-9][0-9]_*.png")))==3
          print("PASS: independent 900-step old/new FEM validation, 458 vs zero surface-penetrating states, real energy and trajectory comparison")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kyoto-stage7-before-after-full-face-research-comparison
          path: results/whole-face-comparison/
          if-no-files-found: error
          retention-days: 30
      - name: Reproduce complete physical-time FEM impact and finite-step reference
        run: ./build/kyoto_time_consistent_experiment results/time-consistent-fem
      - name: Build source-backed adaptive clock, contact impulse and 3D stress figures
        run: |
          python scripts/render_time_consistent_lab.py \
            --input results/time-consistent-fem \
            --output results/time-consistent-fem/visuals
      - name: Independent Pass-8 physical timestep and evidence audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,json,math
          root=Path("results/time-consistent-fem")
          m=json.loads((root/"manifest.json").read_text())
          assert m["actual_solver_physics"]
          assert m["ordinary_steps"]==900
          assert abs(m["ordinary_elapsed_time_s"]-.675)<1e-10
          assert m["ordinary_minimum_triangle_clearance_m"]>0
          assert m["ordinary_minimum_tetra_jacobian"]>0
          assert m["old_global_accepted_fraction"]<1
          assert m["adaptive_rejected_clipped_proposals"]>0
          assert m["adaptive_accepted_physical_substeps"]>1
          assert abs(m["adaptive_total_integrated_time_s"]-m["fast_trial_dt_s"])<1e-12
          assert m["fine_same_model_steps"]==256
          assert not m["same_model_fine_reference_is_independent_solver"]
          history=list(csv.DictReader((root/"routine_900_physics.csv").open()))
          assert len(history)==901
          assert all(float(row["minimum_triangle_clearance_m"])>0 for row in history)
          receipts=list(csv.DictReader((root/"fast_adaptive_accepted_substeps.csv").open()))
          assert len(receipts)==m["adaptive_accepted_physical_substeps"]
          assert abs(sum(float(x["dt_s"]) for x in receipts)-m["fast_trial_dt_s"])<1e-12
          assert all(float(row["minimum_full_triangle_clearance_m"])>=0 for row in receipts)
          comparison=list(csv.DictReader((root/"fast_original_vs_adaptive_vs_fine.csv").open()))
          assert [x["algorithm"] for x in comparison]==["legacy_global_clip",
            "adaptive_full_elapsed_time","fine_256_same_model"]
          states=list(csv.DictReader((root/"fast_event_true_3d_states.csv").open()))
          assert len(states)==4*180
          faces=list(csv.DictReader((root/"fast_event_surface_faces.csv").open()))
          assert len(faces)==320
          v=root/"visuals"
          assert len(list(v.glob("[0-9][0-9]_*.png")))==5
          assert (v/"STAGE8_ADAPTIVE_TIME_REPLAY_ATLAS.png").stat().st_size>100000
          assert (v/"06_interactive_real_FEM_fast_event.html").stat().st_size>100000
          print("PASS: actual full physical dt, 900 steps, split event, 256-step numerical control, no full-face penetration and five scientific plots")
          PY
      - name: Pass 9 independent six-endpoint continuous geometry and Voronoi proof
        run: ./build/kyoto_independent_contact_tests results/pass9-independent
      - name: Pass 9 independent 3D local kinetic, linear and angular impulse balances
        run: ./build/kyoto_impulse_balance_tests results/pass9-independent
      - name: Pass 9 seven actual-source geometry/impulse/3D scientific figures
        run: |
          python scripts/render_pass9_independent_audit.py \
            --input results/pass9-independent \
            --physics results/time-consistent-fem \
            --output results/pass9-independent/visuals
      - name: Validate every independent Pass 9 receipt and figure
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,json,math
          p=Path("results/pass9-independent")
          a=json.loads((p/"independent_manifest.json").read_text())
          b=json.loads((p/"impulse_manifest.json").read_text())
          assert a["independent_of_midpoint_lipschitz_narrowphase"]
          assert not a["machine_directed_rounding_proven"]
          assert a["ordinary_physical_macro_steps"]==900
          assert a["ordinary_accepted_substeps"]>=900
          assert a["ordinary_face_intervals"]==a["ordinary_certified_intervals"]+a["ordinary_unresolved_intervals"]
          assert a["fast_face_intervals"]==a["fast_certified_intervals"]+a["fast_unresolved_intervals"]
          assert a["ordinary_min_static_clearance_m"]>0
          assert a["fast_min_static_clearance_m"]>0
          assert a["ordinary_min_tetra_jacobian"]>0
          assert a["ordinary_max_static_oracle_distance_disagreement_m"]<1e-8
          assert b["sample_count"]==1200
          assert not b["full_FEM_mechanical_energy_conservation_claim"]
          assert b["max_positive_kinetic_change_j"]<1e-5
          assert b["max_energy_work_residual_j"]<1e-5
          assert b["max_linear_momentum_residual_ns"]<1e-5
          assert b["max_angular_momentum_residual_nsm"]<1e-5
          ordinary=list(csv.DictReader((p/"real_fem_independent_sweeps.csv").open()))
          fast=list(csv.DictReader((p/"fast_impact_independent_sweeps.csv").open()))
          face=list(csv.DictReader((p/"fast_impact_face_witnesses.csv").open()))
          impulses=list(csv.DictReader((p/"impulse_balance_cases.csv").open()))
          assert len(ordinary)==900
          assert len(fast)==a["fast_accepted_physical_substeps"]
          assert len(face)==320*len(fast)
          assert len(impulses)==1200
          assert all(float(x["independent_min_static_clearance_m"])>=0 for x in ordinary)
          assert all(float(x["measured_delta_kinetic_j"])<=1e-5 for x in impulses)
          v=p/"visuals"
          assert len(list(v.glob("[0-9][0-9]_*.png")))==7
          assert (v/"STAGE9_INDEPENDENT_CONTACT_SCIENCE_ATLAS.png").stat().st_size>100000
          print("PASS: independent geometric audit",a["ordinary_face_intervals"],
                "routine swept faces with",a["ordinary_unresolved_intervals"],
                "undecided, and",a["fast_face_intervals"],"fast swept faces with",
                a["fast_unresolved_intervals"],"undecided; 1200 impulse law identities")
          PY
      - name: Pass 10 outward IEEE interval proof on all original moving FEM triangles
        run: ./build/kyoto_rounded_prism_tests results/pass10-rounded
      - name: Pass 10 entire 3D FEM gravity/elasticity/damping/impulse momentum ledger
        run: ./build/kyoto_whole_fem_balance_tests results/pass10-rounded
      - name: Render actual-source seven-figure interval and discrete-physics atlas
        run: |
          python scripts/render_pass10_numerical_audit.py \
            --input results/pass10-rounded \
            --physics results/time-consistent-fem \
            --output results/pass10-rounded/visuals
      - name: Validate entire Pass 10 numerical/contact scientific record
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,json,math
          p=Path("results/pass10-rounded")
          n=json.loads((p/"rounded_manifest.json").read_text())
          m=json.loads((p/"whole_fem_balance_manifest.json").read_text())
          assert n["ieee754_outward_intervals_used"]
          assert n["assumes_correctly_rounded_ops_ftz_disabled"]
          assert not n["formal_hardware_software_proof"]
          assert not n["general_mesh_mesh_CCD"]
          assert n["ordinary_macro_steps"]==900
          assert n["ordinary_face_intervals"]==288000
          assert n["ordinary_strictly_proven"]+n["ordinary_unresolved"]==288000
          assert n["fast_face_intervals"]==320*n["fast_physical_substeps"]
          assert n["fast_strictly_proven"]+n["fast_unresolved"]==n["fast_face_intervals"]
          assert n["random_separated_cases"]==500
          assert n["ordinary_min_verified_margin_m"]>0
          assert n["fast_min_verified_margin_m"]>0
          assert n["ordinary_outward_dot_checks"]>0
          assert n["fast_outward_dot_checks"]>0
          assert m["routine_accepted_physical_substeps"]==900
          assert m["fast_accepted_physical_substeps"]==n["fast_physical_substeps"]
          assert m["routine_leaves_with_contact"]>0
          assert m["angular_transport_term_included"]
          assert not m["true_physics_calibration_proven"]
          assert not m["global_energy_conservation_required"]
          assert m["routine_max_relative_momentum_residual"]<1e-10
          assert m["routine_max_relative_angular_residual"]<1e-10
          assert m["fast_max_relative_momentum_residual"]<1e-10
          assert m["fast_max_relative_angular_residual"]<1e-10
          assert m["routine_max_internal_force_relative"]<1e-10
          assert m["routine_max_internal_torque_relative"]<1e-10
          assert m["fast_max_internal_force_relative"]<1e-10
          assert m["fast_max_internal_torque_relative"]<1e-10
          r=list(csv.DictReader((p/"rounded_routine_900.csv").open()))
          fast=list(csv.DictReader((p/"rounded_fast_substeps.csv").open()))
          faces=list(csv.DictReader((p/"rounded_fast_1600_faces.csv").open()))
          balance=list(csv.DictReader((p/"whole_FEM_accepted_substep_balance.csv").open()))
          assert len(r)==900
          assert len(fast)==n["fast_physical_substeps"]
          assert len(faces)==n["fast_face_intervals"]
          assert len(balance)==900+len(fast)
          assert all(float(x["momentum_relative"])<1e-10 for x in balance)
          assert all(float(x["angular_relative"])<1e-10 for x in balance)
          assert all(float(x["internal_force_relative"])<1e-10 for x in balance)
          assert all(float(x["internal_torque_relative"])<1e-10 for x in balance)
          visuals=p/"visuals"
          assert len(list(visuals.glob("[0-9][0-9]_*.png")))==7
          assert (visuals/"STAGE10_ROUNDED_CONTACT_AND_FEM_PHYSICS_ATLAS.png").stat().st_size>100000
          assert (visuals/"08_interactive_3D_stress_and_rounded_clearance.html").stat().st_size>100000
          print("PASS: outward IEEE interval sweep",
                n["ordinary_strictly_proven"],"of",n["ordinary_face_intervals"],
                "routine and",n["fast_strictly_proven"],"of",
                n["fast_face_intervals"],"fast; uncertain:",
                n["ordinary_unresolved"]+n["fast_unresolved"],
                "; full momentum and angular ledger over",len(balance),"physical substeps")
          PY
      - name: Pass 11 finite rigid triangle mesh true VF EE and piercing negative control
        run: ./build/kyoto_triangle_mesh_tests results/pass11-mesh
      - name: Pass 11 real nonplanar indexed rigid triangle contact neo-Hookean FEM
        run: ./build/kyoto_rigid_mesh_fem_tests results/pass11-mesh
      - name: Pass 11C real adaptive FAST impact against nonplanar rigid triangle mesh
        run: ./build/kyoto_fast_mesh_impact_tests results/pass11-mesh
      - name: Pass 11 scientific original FEM 3D, contact impulse and GIF visual atlas
        run: |
          python scripts/render_pass11_real_triangle_fem.py \
            --input results/pass11-mesh \
            --output results/pass11-mesh/visuals
      - name: Inspect complete actual 3D finite-mesh rigid collision evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,csv,math
          root=Path("results/pass11-mesh")
          m=json.loads((root/"rigid_mesh_manifest.json").read_text())
          assert m["actual_rigid_triangle_contact_response"]
          assert not m["sphere_used_to_resolve_mesh_contact"]
          assert not m["rounding_formally_certified"]
          assert not m["self_contact_solved"]
          assert not m["implicit_KKT_or_IPC_barrier_physics"]
          assert m["physical_steps"]==900
          assert abs(m["final_physical_time_s"]-.675)<1e-9
          assert m["deformable_vertices"]==180
          assert m["deformable_tetrahedra"]==480
          assert m["deformable_surface_triangles"]==320
          assert m["rigid_vertices"]==49 and m["rigid_triangles"]==72
          assert m["first_contact_time_s"]>0
          assert m["actual_contact_steps"]>0
          assert m["face_impulse_updates"]>0
          assert m["accepted_actual_physical_leaves"]>=900
          assert m["smallest_full_face_mesh_clearance_m"]>0
          assert m["smallest_tetra_jacobian"]>1e-6
          states=list(csv.DictReader((root/"rigid_triangle_physics_900.csv").open()))
          verts=list(csv.DictReader((root/"rigid_triangle_physical_vertices.csv").open()))
          negative=list(csv.DictReader((root/"real_FEM_against_nonresponding_rigid_mesh.csv").open()))
          fast=json.loads((root/"fast_mesh_manifest.json").read_text())
          assert fast["true_nonplanar_rigid_triangle_collision"]
          assert fast["unsafe_full_step_rejected"]
          assert not fast["old_sphere_contact_used"]
          assert not fast["universal_stability_proven"]
          assert fast["geometrically_rejected_proposals"]>0
          assert fast["accepted_physical_substeps"]>1
          assert abs(fast["actual_accepted_physical_time_s"]-.00075)<1e-12
          assert fast["minimum_accepted_mesh_triangle_gap_m"]>0
          assert fast["minimum_accepted_tet_jacobian"]>1e-6
          leaves=list(csv.DictReader((root/"fast_finite_mesh_physical_leaves.csv").open()))
          assert len(leaves)==fast["accepted_physical_substeps"]
          assert abs(sum(float(x["actual_dt_s"]) for x in leaves)-.00075)<1e-12
          assert all(float(x["min_full_triangle_gap_m"])>0 for x in leaves)

          assert len(states)==901 and len(verts)==91*180
          assert len(negative)==181
          assert all(float(x["finite_triangle_min_distance_m"])>0 for x in states)
          assert all(float(x["min_tetra_j"])>1e-6 for x in states)
          assert sum(int(x["face_impulse_updates"]) for x in states)==m["face_impulse_updates"]
          assert len(list(csv.DictReader((root/"deformable_surface_triangles.csv").open())))==320

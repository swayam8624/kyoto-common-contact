name: Kyoto Pass 13 real FEM reference broadphase

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [research/spacetime-contact-atlas]
    paths:
      - "apps/pass13_reference_fem_benchmark.cpp"
      - "tests/refit_feature_hierarchy_tests.cpp"
      - "tests/selective_refit_tests.cpp"
      - "tests/uncoupled_multibody_fem_tests.cpp"
      - "tests/fem_feature_snapshots_tests.cpp"
      - "tests/maintained_broadphase_fuzz_tests.cpp"
      - "scripts/report_pass13_fem_baselines.py"
      - ".github/workflows/pass13-fem-reference.yml"
      - "CMakeLists.txt"
      - "include/kyoto/**"
  workflow_dispatch:

jobs:
  native-fem-candidate-reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build native physically integrated FEM benchmark
        run: |
          cmake -S . -B build-pass13 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-pass13 --target kyoto_pass13_reference_fem_benchmark kyoto_refit_feature_hierarchy_tests kyoto_fem_feature_snapshots_tests kyoto_maintained_broadphase_fuzz_tests kyoto_selective_refit_tests kyoto_uncoupled_multibody_fem_tests --parallel 4
          ctest --test-dir build-pass13 -R "maintained_refit_hierarchy_VF_EE_oracle_and_invalidation|identical_real_FEM_feature_source_and_refit_contract|independent_seeded_3D_feature_broadphase_fuzz|selective_3D_feature_refit_exhaustive_oracle_and_rollback|real_two_body_FEM_uncoupled_shared_feature_oracle" --output-on-failure
      - name: Check solver-derived exhaustive and sweep parity and archive original timings
        run: |
          ./build-pass13/kyoto_pass13_reference_fem_benchmark results/pass13/native
          python3 -m pip install matplotlib
          python3 scripts/report_pass13_fem_baselines.py \
            --input results/pass13/native/native_fem_reference_broadphase.csv \
            --output results/pass13/science
      - name: Preserve original evidence
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-pass13-real-fem-reference-${{ matrix.os }}
          path: results/pass13/
          if-no-files-found: error

name: Kyoto Phase 18 — real eligible online decisions and randomized original policies
on:
  push:
    branches:
      - research/kyoto-decision-coverage
    paths:
      - '.github/workflows/kyoto-decision-coverage.yml'
      - 'apps/material_replay_benchmark.cpp'
      - 'scripts/run_kyoto_decision_coverage.py'
      - 'scripts/analyze_kyoto_decision_coverage.py'
      - 'scripts/recheck_kyoto_phase18_aa.py'
      - 'scripts/test_kyoto_decision_coverage.py'
      - 'scripts/audit_kyoto_phase17_decisions.py'
      - 'scripts/kyoto_research_dashboard.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-policy-decision-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Python and shell syntax
        run: |
          python3 -m py_compile scripts/run_kyoto_decision_coverage.py scripts/test_kyoto_decision_coverage.py scripts/analyze_kyoto_decision_coverage.py scripts/recheck_kyoto_phase18_aa.py
      - name: Build original full-output policies without modifying frozen V4
        run: |
          cmake --preset kyoto-final-cpu
          cmake --build build/kyoto-final-cpu --target ccp_material_export ccp_material_replay --parallel 2
      - name: Independent SAP checks under seeded execution-order permutations
        run: |
          python3 scripts/test_kyoto_decision_coverage.py \
            build/kyoto-final-cpu/ccp_material_export \
            build/kyoto-final-cpu/ccp_material_replay
      - name: Exercise at least one actual size-eligible V4 trajectory and a separate diagnostic
        run: |
          python3 scripts/run_kyoto_decision_coverage.py \
            --exporter build/kyoto-final-cpu/ccp_material_export \
            --replayer build/kyoto-final-cpu/ccp_material_replay \
            --output output/phase18-decision-ci \
            --budgets 512 --materials cloth \
            --regimes baseline rapid --seeds 3203 --frames 24 --warmup 4
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('output/phase18-decision-ci')
          data = json.loads((root/'DECISION_COVERAGE.json').read_text())
          assert data['groups']['natural']['trajectories'] == 2
          assert data['groups']['natural']['observed_eligible_scenes'] == 2
          assert data['groups']['rigid_translation_diagnostic']['trajectories'] == 1
          assert all(x['actual_n'] >= 384 for x in data['results'])
          assert len({x['order_seed'] for x in data['results']}) == 3
          assert {'global_guarded_exact','online_cost_aware',
                  'guard_sap_bounded_trial','sap_persistent_coherent'}.issubset(
                  data['tested_methods'])
          print('PASS: all actual-N eligible; full pair set verified; actions counted')
          PY
      - name: Diagnostic at 2048 primitives and 60 frames without changing V4 thresholds
        run: |
          python3 scripts/run_kyoto_decision_coverage.py \
            --exporter build/kyoto-final-cpu/ccp_material_export \
            --replayer build/kyoto-final-cpu/ccp_material_replay \
            --output output/phase18-highstress-ci \
            --budgets 2048 --materials cloth \
            --regimes rapid --seeds 3217 --frames 60 --warmup 8
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('output/phase18-highstress-ci/DECISION_COVERAGE.json').read_text())
          assert len(data['results'])==2
          assert all(x['actual_n']>=2048 for x in data['results'])
          for cohort, result in data['groups'].items():
              assert result['guard_frames']+result['sap_frames'] == (
                  result['trajectories']*60)
              print('2048-object control decisions:',cohort,result)
          PY
      - name: Verify and rank all actually executed policies from existing exact CSVs
        run: |
          python3 scripts/analyze_kyoto_decision_coverage.py \
            --results output/phase18-decision-ci \
            --output output/phase18-decision-ci/verified-methods
          python3 scripts/analyze_kyoto_decision_coverage.py \
            --results output/phase18-highstress-ci \
            --output output/phase18-highstress-ci/verified-methods
          python3 - <<'PY'
          import json
          from pathlib import Path
          for folder, expected in [('output/phase18-decision-ci',3),('output/phase18-highstress-ci',2)]:
              output = Path(folder)/'verified-methods'/'VERIFIED_ALL_METHODS.json'
              data = json.loads(output.read_text())
              assert len(data['individual_trajectories']) == expected
              assert len(data['methods_actually_run']) >= 10
              assert data['framewise_sap_parity_verified'] if 'framewise_sap_parity_verified' in data else data['all_source_sha256_verified']
              assert data['groups']['natural']['trajectories'] >= 1
              assert data['groups']['rigid_translation_diagnostic']['trajectories'] == 1
              print('ALL methods scored from immutable CSV receipts:', output)
          PY
          python3 - <<'PY'
          # Tamper with a copy of the manifest, not any immutable source data.
          # The post-run analysis must fail closed on mismatched source digest.
          import json, pathlib, subprocess, tempfile
          with tempfile.TemporaryDirectory() as temp:
              root=pathlib.Path(temp)
              d=json.loads(pathlib.Path('output/phase18-decision-ci/DECISION_COVERAGE.json').read_text())
              d['data'][0]['csv_sha256'] = '0'*64
              (root/'DECISION_COVERAGE.json').write_text(json.dumps(d))
              p=subprocess.run(['python3','scripts/analyze_kyoto_decision_coverage.py',
                  '--results',str(root),'--output',str(root/'should-not-exist')],
                  stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
              assert p.returncode != 0
              assert not (root/'should-not-exist').exists()
              print('PASS: altered source SHA-256 is rejected without writing a report')
          PY
      - name: Independent Guard/V4 A/A clones on the exact saved material snapshots
        run: |
          python3 scripts/recheck_kyoto_phase18_aa.py \
            --results output/phase18-decision-ci \
            --replayer build/kyoto-final-cpu/ccp_material_replay \
            --output output/phase18-decision-ci/aa-closedloop-ci \
            --repeats 2
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/phase18-decision-ci/aa-closedloop-ci/AA_RECHECK.json')
          data=json.loads(p.read_text())
          assert data['performed_no_new_material_simulations'] is True
          assert data['source_trajectories']==2
          assert data['timed_native_replays']==4
          assert data['cohorts']['natural']['paired_runs']==4
          for trial in data['per_repeat']:
              methods=set(trial['methods'])
              assert {'global_guarded_exact','global_guarded_exact_aa',
                      'guard_sap_bounded_trial','guard_sap_bounded_trial_aa',
                      'online_cost_aware','sap_rebuild'}.issubset(methods)
              assert trial['v4_action_mismatch_frames']>=0
              assert trial['guard_aa_ratio']>0
          print('PASS: frozen Guard and V4 independently instantiated twice, all framewise pairs match original SAP')
          PY
          python3 - <<'PY'
          import json, pathlib, subprocess
          root=pathlib.Path('output/phase18-decision-ci')
          inp=next((root/'snapshots').glob('*.kmcb'))
          target=root/'invalid-no-orderseed.csv'
          run=subprocess.run(['build/kyoto-final-cpu/ccp_material_replay',
              str(inp),str(target),'0','--aa-control'],
              capture_output=True,text=True)
          assert run.returncode != 0
          assert not target.exists()
          print('PASS: invalid A/A invocation rejected before opening evidence CSV')
          PY
      - name: Preserve evidence regardless of benchmark outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-phase18-decision-coverage-evidence
          path: |
            output/phase18-decision-ci/DECISION_COVERAGE.json
            output/phase18-decision-ci/DECISION_COVERAGE.md
            output/phase18-decision-ci/replays/
            output/phase18-decision-ci/logs/
            output/phase18-highstress-ci/DECISION_COVERAGE.json
            output/phase18-highstress-ci/DECISION_COVERAGE.md
            output/phase18-highstress-ci/replays/
            output/phase18-decision-ci/verified-methods/
            output/phase18-highstress-ci/verified-methods/
            output/phase18-decision-ci/aa-closedloop-ci/AA_RECHECK.json
            output/phase18-decision-ci/aa-closedloop-ci/AA_RECHECK.md
          retention-days: 14
          if-no-files-found: warn

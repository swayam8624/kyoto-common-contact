name: Pass 56 duration-parametric physical validation
on:
  push:
    branches: [research/pass56-parametric-duration]
  pull_request:
    paths:
      - 'tools/pass56*'
      - '.github/workflows/pass56-duration.yml'
  workflow_dispatch:
jobs:
  physical:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 casadi==3.7.2
      - run: |
          python tools/pass56_benchmark.py vertex vertex --blocks 2
          python tools/pass56_benchmark.py replica8 replica8 --blocks 1
          python tools/pass56_benchmark.py replica_reverse replica8 --blocks 1 --reverse
          python tools/pass56_controls.py
          python tools/pass56_audit.py
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('audit.json').read_text())
          assert len(rows)==4
          assert all(r['position_error']<1e-10 and r['velocity_error']<1e-8 for r in rows)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass56-${{ matrix.os }}
          path: |
            vertex/
            replica8/
            replica_reverse/
            audit.json
          if-no-files-found: error
  scale:
    strategy:
      fail-fast: false
      matrix:
        geometry: [u78, comb120, u156]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 casadi==3.7.2
      - run: python tools/pass56_benchmark.py scaled ${{ matrix.geometry }} --blocks 2 --macros 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass56-scale-${{ matrix.geometry }}
          path: scaled/
          if-no-files-found: error

name: Kyoto visual and cleanup regression
on:
  push:
    branches:
      - feature/kyoto-benchmark-visual-cleanup
  workflow_dispatch:
jobs:
  visual-and-solver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and documented dependencies
        run: |
          python3 -m py_compile scripts/render_kyoto_visuals.py scripts/build_kyoto_visual_suite.py
          python3 -m pip install --user Pillow
      - name: Compile actual solver, visual export and frozen V4 controls
        run: |
          cmake -S . -B /tmp/kyoto-visual-ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build /tmp/kyoto-visual-ci --target ccp_solver_visual_export ccp_material_export ccp_material_replay ccp_final_broadphase_api_tests --parallel 4
      - name: Run frozen V4 exactness API regression
        run: |
          ctest --test-dir /tmp/kyoto-visual-ci --output-on-failure -R 'final_broadphase_public_api_exact_pair_oracle'
      - name: End-to-end real solver and six material visual smoke
        run: |
          python3 scripts/build_kyoto_visual_suite.py \
            --build /tmp/kyoto-visual-ci \
            --output /tmp/kyoto-visual-evidence \
            --regimes impact \
            --frames 8 \
            --solver-frames 8 \
            --elements 32 \
            --solver-sheets 1 \
            --solver-balls 1 \
            --render-frames 3
          test -s /tmp/kyoto-visual-evidence/visuals/coupled-solver.gif
          test -s /tmp/kyoto-visual-evidence/visuals/aabb-impact.gif
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/kyoto-visual-evidence')
          report=json.loads((root/'EVIDENCE_SUMMARY.json').read_text())
          assert len(report['aabb_oracle'])==6
          assert len(report['solver_geometry'])==4
          assert all(x['maximum_position_deviation_from_sap_m']<1e-5
                     for x in report['solver_geometry'].values()),report['solver_geometry']
          assert all(x['all_exact_pair_hashes_match']
                     for scene in report['aabb_oracle'].values() for x in scene.values())
          print('PASS: exact visual material pair parity and coupled solver state equivalence')
          PY
      - name: Publish small representative visual CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-visual-smoke
          path: /tmp/kyoto-visual-evidence/visuals/*.gif

name: RBC repeated ten-policy native full-pair/A-A sensitivity pilot
on:
  push:
    branches:
      - research/reach-budget-calculus
    paths:
      - '.github/workflows/rbc-repeated-source-study.yml'
      - 'apps/rbc_material_replay.cpp'
      - 'scripts/run_rbc_controlled_replays.py'
      - 'scripts/test_rbc_controlled_study.py'
      - 'include/ccp/rbc/sweep_certificate.hpp'
      - 'CMakeLists.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repeated-aabb-exact-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Confirm no frozen V4 source change
        run: |
          set -euo pipefail
          git fetch origin research/kyoto-decision-coverage:refs/remotes/origin/research/kyoto-decision-coverage
          git diff --exit-code origin/research/kyoto-decision-coverage -- include/ccp/final_broadphase.hpp
      - name: Compile native source exporter and independently registered ten-method replay
        run: |
          cmake -S . -B build/rbc-AA-ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/rbc-AA-ci --parallel 3 \
            --target ccp_material_export ccp_rbc_material_replay \
                     ccp_rbc_sweep_certificate_tests
          ctest --test-dir build/rbc-AA-ci -R 'rbc_indexed_certificate_exact_pair_oracle' --output-on-failure
      - name: Generate twelve NEW exploratory original material sources with explicit independent mesh receipts
        run: |
          set -euo pipefail
          mkdir -p output/rbc-ten-policy-native-pilot/sources
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('output/rbc-ten-policy-native-pilot')
          source=root/'sources'
          exporter=Path('build/rbc-AA-ci/ccp_material_export')
          materials=('cloth','sponge','cushion','soft_ball','spring','mixed')
          manifest=[]
          for mi,material in enumerate(materials):
              for budget in (128,512):
                  motion=177101+mi*311+budget
                  geo=303101+mi*719+budget
                  topo=407101+mi*827+budget
                  path=source/(material+'-b'+str(budget)+'-g'+str(geo)+'-t'+str(topo)+'.kmcb')
                  with (root/(path.stem+'.export.log')).open('x') as logfile:
                      subprocess.run([str(exporter),str(path),material,str(budget),
                                      '60',str(motion),'rapid',str(geo),str(topo)],
                                     check=True,stdout=logfile,stderr=subprocess.STDOUT,
                                     timeout=120)
                  sha=hashlib.sha256(path.read_bytes()).hexdigest()
                  manifest.append({'material':material,'snapshot':str(path),
                                   'snapshot_sha256':sha,'budget':budget,
                                   'geometry_seed':geo,'topology_seed':topo})
          (root/'HELDOUT_RESULTS.json').write_text(
              json.dumps({'material_replays':manifest,
                          'research_label':'DEVELOPMENT ONLY fresh exploratory, NOT untouched holdout',
                          'source_cohort_count':len(manifest)},indent=2)+'\n')
          print('PASS: 12 genuine NEW original KYOTOM01 source receipts generated and preserved')
          PY
      - name: Execute twelve true ten-policy, four-repetition A-A controls with all-frame exact independent source pair hashes
        run: |
          set -euo pipefail
          python3 scripts/run_rbc_controlled_replays.py \
            --replayer build/rbc-AA-ci/ccp_rbc_material_replay \
            --manifest output/rbc-ten-policy-native-pilot/HELDOUT_RESULTS.json \
            --output output/rbc-ten-policy-native-pilot/native-repeated \
            --repeats 4 --warmup 8
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/rbc-ten-policy-native-pilot/native-repeated/RBC_CONTROLLED_RESULTS.json')
          d=json.loads(p.read_text())
          assert d['source_scene_count']==12
          assert d['repetitions']==4
          assert len(d['method_names'])==10
          assert d['all_original_source_sha256_receipts_verified']
          assert d['all_natively_emitted_pair_sets_exact']
          assert all(r['result']['native_rows']==4*10*52 for r in d['scenes'])
          assert all(r['result']['all_current_full_pair_hashes_identical']
                     for r in d['scenes'])
          print('PASS: 24,960 native measured original method/frame rows across '
                '12 exact scenes and four repeated forward/reverse ordered trajectories')
          print((p.parent/'RBC_CONTROLLED_RESULTS.md').read_text())
          PY
      - name: Preserve every new immutable source, exact native full-pair timing CSV and A-A receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-rbc-twelve-source-ten-policy-four-repeat-AA-original-native-evidence
          path: output/rbc-ten-policy-native-pilot/
          if-no-files-found: warn

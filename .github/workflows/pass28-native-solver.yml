name: Pass 28 native FEM physical parity
on:
  pull_request:
    branches: [validation/sca-pass34-base]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --target kyoto_static_face_solver_parity_tests --parallel 2
      - run: ctest --test-dir build -R actual_FEM_static_face_broadphase_physical_parity --output-on-failure --no-tests=error -V
      - run: cmake --build build --target kyoto_coupled_triangle_normal_impulse_tests --parallel 2
      - run: ctest --test-dir build -R two_finite_mass_triangle_normal_impulse_balance --output-on-failure --no-tests=error -V
      - run: cmake --build build --target kyoto_tet_orientation_certificate_tests --parallel 2
      - run: ctest --test-dir build -R outward_continuous_tet_orientation_certificate --output-on-failure --no-tests=error -V
      - run: cmake --build build --target kyoto_rounded_relative_triangle_tests --parallel 2
      - run: ctest --test-dir build -R outward_relative_moving_triangle_surface_certificate --output-on-failure --no-tests=error -V
      - run: cmake --build build --target kyoto_coupled_fem_contact_tests --parallel 2
      - run: ctest --test-dir build -R synchronized_two_body_FEM_contact_and_rollback --output-on-failure --no-tests=error -V
      - run: cmake --build build --target kyoto_nonincident_self_contact_tests --parallel 2
      - run: ctest --test-dir build -R restricted_nonincident_same_body_contact --output-on-failure --no-tests=error -V
      - run: cmake --build build --target kyoto_typed_self_contact_audit_tests --parallel 2
      - run: ctest --test-dir build -R typed_adjacent_face_self_contact_audit --output-on-failure --no-tests=error -V
      - run: cmake --build build --target kyoto_typed_connected_self_contact_tests --parallel 2
      - run: ctest --test-dir build -R typed_connected_FEM_self_contact --output-on-failure --no-tests=error -V
  initial-volume:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --target kyoto_initial_tet_separation_tests kyoto_initial_tet_exact_oracle_tests kyoto_initial_volume_fem_tests kyoto_volume_boundary_topology_tests kyoto_volume_boundary_fixture_tests kyoto_native_volume_boundary_fixture_tests --parallel 2
      - run: ctest --test-dir build -R 'outward_initial_tetrahedral_separation|initial_tetrahedral_exact_integer_oracle|initial_volume_FEM_containment_rollback|complete_volume_boundary_topology|standalone_volume_boundary_fixture_patterns|actual_native_volume_boundary_factories' --no-tests=error --output-on-failure -V
  persistent-context:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --target kyoto_persistent_fem_context_tests --parallel 2
      - run: ctest --test-dir build -R persistent_typed_FEM_physical_parity --no-tests=error --output-on-failure -V
  connected-volumes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --target kyoto_coupled_torus_physics_tests --parallel 2
      - run: ./build/kyoto_coupled_torus_physics_tests results/pass31b
      - uses: actions/upload-artifact@v4
        with:
          name: pass31b-native-volumetric-evidence-${{ matrix.os }}
          path: results/pass31b/
          if-no-files-found: error
  exact-static-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - run: cmake -S . -B build-exact -DCMAKE_BUILD_TYPE=Release -DKYOTO_WITH_EXACT_SELF_VOLUME=ON
      - run: cmake --build build-exact --target kyoto_exact_tet_intersection_tests kyoto_exact_volume_fixture_tests kyoto_native_exact_self_volume_tests kyoto_exact_swept_tet_certificate_tests kyoto_exact_swept_volume_fixture_tests kyoto_native_exact_swept_volume_tests kyoto_swept_cell_candidates_tests kyoto_exact_factored_axis_tests kyoto_exact_constant_axis_tests kyoto_exact_axis_heldout_tests kyoto_exact_axis_heldout_volume_tests --parallel 2
      - run: ctest --test-dir build-exact -R 'exact_static_tetrahedral_intersection|exact_static_volume_fixture_patterns|exact_static_native_FEM_endpoint_self_volume|exact_continuous_tetrahedral_separation|exact_continuous_volume_fixture_patterns|exact_continuous_native_FEM_leaf_volume|swept_cell_candidate_exhaustive_parity|exact_factored_axis_coefficient_and_pair_parity|exact_constant_axis_polynomial_parity|exact_axis_heldout_pair_parity|exact_axis_heldout_whole_volume_parity' --no-tests=error --output-on-failure -V

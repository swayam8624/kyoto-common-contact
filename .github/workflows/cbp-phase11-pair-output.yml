name: CBP Phase 11 — REAL full candidate pair output-stream pressure
on:
  push:
    branches:
      - research/common-broadphase-orchestrator
    paths:
      - 'apps/cbp_pressure_emit.cpp'
      - 'include/ccp/cbp_pressure.hpp'
      - '.github/workflows/cbp-phase11-pair-output.yml'
      - 'CMakeLists.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile real exact AABB pair materialization
        run: |
          cmake --preset kyoto-final-cpu
          cmake --build build/kyoto-final-cpu \
            --target ccp_cbp_pressure_emit ccp_cbp_pressure_cpu --parallel 2
      - name: Brute checked small real pair stream and 65K dense output
        timeout-minutes: 4
        run: |
          mkdir -p build/phase11-stream
          build/kyoto-final-cpu/ccp_cbp_pressure_emit \
            build/phase11-stream/512-complete.csv \
            burst 512 4 61749 30000000 30000 64 /dev/null
          build/kyoto-final-cpu/ccp_cbp_pressure_emit \
            build/phase11-stream/65536-complete.csv \
            burst 65536 4 61749 300000000 30000 128 /dev/null
      - name: Actually stream tens of millions of 8-byte pairs at million scale
        timeout-minutes: 8
        run: |
          build/kyoto-final-cpu/ccp_cbp_pressure_emit \
            build/phase11-stream/1000000-burst-4frames.csv \
            burst 1000000 4 61749 300000000 40000 384 /dev/null
          python3 - <<'PY'
          import csv
          from pathlib import Path
          base=Path('build/phase11-stream')
          for name in ('512-complete.csv','65536-complete.csv',
                       '1000000-burst-4frames.csv'):
              rows=list(csv.DictReader((base/name).open()))
              assert len(rows)==4
              assert all(r['status']=='VERIFIED_WRITTEN' for r in rows)
              assert all(r['first_count_digest_matches']=='1' for r in rows)
              assert all(int(r['real_pair_bytes']) ==
                         int(r['exact_candidate_pairs'])*8 for r in rows)
              print('FULL PAIR STREAM',name,
                    'largest frame candidate bytes',
                    max(int(r['real_pair_bytes']) for r in rows),
                    'total actually streamed bytes',
                    sum(int(r['real_pair_bytes']) for r in rows))
          assert max(int(x['real_pair_bytes'])
                     for x in csv.DictReader(
                         (base/'1000000-burst-4frames.csv').open()))>=250000000
          PY
      - name: Upload verified pair output receipts (not huge binary bodies)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbp-phase11-million-real-candidate-output-stream
          path: build/phase11-stream/*.csv
          retention-days: 14
          if-no-files-found: warn

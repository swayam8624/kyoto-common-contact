name: Kyoto final validated CPU API
on:
  push:
    branches:
      - release/kyoto-broadphase-final-validated
  workflow_dispatch:

jobs:
  exact-pair-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build only the final API and reproducible oracle executables
        run: |
          cmake -S . -B /tmp/kyoto-final -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build /tmp/kyoto-final --target ccp_final_broadphase_api_tests ccp_material_export ccp_material_replay --parallel 4
      - name: Exact pair parity — public API and frozen V4 replay
        run: |
          ctest --test-dir /tmp/kyoto-final --output-on-failure -R 'final_broadphase_public_api_exact_pair_oracle|learned_cpp_model_and_exact_pair_oracle'
      - name: Verify the final V4-only capability contract
        run: |
          /tmp/kyoto-final/ccp_material_replay --capabilities | tee /tmp/kyoto-final/capabilities.txt
          grep -q KYOTO_REPLAY_ABLATION_V4 /tmp/kyoto-final/capabilities.txt
          grep -q guard_sap_bounded_trial /tmp/kyoto-final/capabilities.txt

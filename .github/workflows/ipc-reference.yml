name: Kyoto official IPC Toolkit v1.6.1 reference
on:
  push:
    branches: [research/spacetime-contact-atlas]
    paths:
      - 'CMakeLists.txt'
      - 'tests/ipc_lbvh_parity_tests.cpp'
      - 'tests/ipc_continuous_ccd_tests.cpp'
      - 'scripts/render_real_ccd_lab.py'
      - '.github/workflows/ipc-reference.yml'
  workflow_dispatch:
jobs:
  official-ipc-lbvh-and-ccd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake pkg-config libtbb-dev
      - name: Configure pinned official IPC Toolkit
        run: |
          cmake -S . -B build-ipc -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DKYOTO_WITH_OFFICIAL_IPC=ON \
            -DIPC_TOOLKIT_WITH_SIMD=OFF \
            -DIPC_TOOLKIT_WITH_MESHFEM_SPARSE=OFF
      - name: Build real external LBVH and CCD tests
        run: cmake --build build-ipc --target kyoto_official_ipc_lbvh_tests kyoto_official_ipc_ccd_tests --parallel 4
      - name: Execute official LBVH conservative-pair coverage oracle
        run: |
          set -o pipefail
          ctest --test-dir build-ipc -R pinned_official_ipc_lbvh_feature_coverage --output-on-failure -V | tee ipc-lbvh-coverage.log
      - name: Run actual upstream CCD against exhaustive feature enumeration
        run: |
          set -o pipefail
          ./build-ipc/kyoto_official_ipc_ccd_tests results/ccd-gate | tee ipc-ccd-gate.log
          ctest --test-dir build-ipc -R pinned_official_ipc_continuous_CCD_coverage --output-on-failure
      - name: Check raw CCD audit coverage
        run: |
          python - <<'PY'
          import csv, pathlib
          p=pathlib.Path("results/ccd-gate")
          lines=list(csv.DictReader((p/"ccd_cases.csv").open()))
          assert len(lines)==35,len(lines)
          assert all(int(x["total_events"])==int(x["exhaustive_events"]) for x in lines)
          by_name={x["case_name"]:x for x in lines}
          for k in ("VF_TRUE_MIDSTEP","EE_TRUE_MIDSTEP","VF_TRUE_ASYMMETRIC"):
              assert int(by_name[k]["total_events"])>0,k
          for k in ("VF_BOX_FALSE_POSITIVE","VF_DISJOINT_Z","EE_SEPARATE_Y",
                    "EE_TIME_ALIAS_NO_COLLISION"):
              assert int(by_name[k]["total_events"])==0,k
          assert (p/"linear_vertex_paths.csv").is_file()
          print("PASS: actual upstream narrow-phase CCD, analytic fixtures, exhaustive feature enumeration")
          PY
      - name: Install visualization dependencies for real CCD evidence
        run: python -m pip install numpy==2.2.6 matplotlib==3.10.7
      - name: Render real-upstream CCD geometry and proof atlas
        run: python scripts/render_real_ccd_lab.py --input results/ccd-gate --output results/ccd-gate/visuals
      - name: Check visualization completeness
        run: |
          python - <<'PY'
          from pathlib import Path
          d=Path("results/ccd-gate/visuals")
          charts=list(d.glob("[0-9][0-9]_*.png"))
          assert len(charts)==5,charts
          assert min(f.stat().st_size for f in charts)>10000
          print("PASS: five C++ source-backed upstream CCD scientific figures")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-real-ipc-v161-continuous-ccd-evidence
          path: |
            results/ccd-gate/
            ipc-ccd-gate.log
            ipc-lbvh-coverage.log
          if-no-files-found: ignore
          retention-days: 30

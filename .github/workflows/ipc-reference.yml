name: Kyoto official IPC Toolkit v1.6.1 reference

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [research/spacetime-contact-atlas]
    paths:
      - 'CMakeLists.txt'
      - 'tests/ipc_lbvh_parity_tests.cpp'
      - 'tests/ipc_continuous_ccd_tests.cpp'
      - 'tests/ipc_solid_trajectory_audit.cpp'
      - 'include/kyoto/solid_dynamics.hpp'
      - 'scripts/render_real_ccd_lab.py'
      - 'scripts/render_ipc_solid_audit.py'
      - '.github/workflows/ipc-reference.yml'
  workflow_dispatch:
jobs:
  official-ipc-lbvh-and-ccd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake pkg-config libtbb-dev
      - name: Configure pinned official IPC Toolkit
        run: |
          cmake -S . -B build-ipc -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DKYOTO_WITH_OFFICIAL_IPC=ON \
            -DIPC_TOOLKIT_WITH_SIMD=OFF \
            -DIPC_TOOLKIT_WITH_MESHFEM_SPARSE=OFF
      - name: Build real external LBVH and CCD tests
        run: cmake --build build-ipc --target kyoto_official_ipc_lbvh_tests kyoto_official_ipc_ccd_tests kyoto_official_ipc_solid_audit --parallel 4
      - name: Execute official LBVH conservative-pair coverage oracle
        run: |
          set -o pipefail
          ctest --test-dir build-ipc -R pinned_official_ipc_lbvh_feature_coverage --output-on-failure -V | tee ipc-lbvh-coverage.log
      - name: Run actual upstream CCD against exhaustive feature enumeration
        run: |
          set -o pipefail
          ./build-ipc/kyoto_official_ipc_ccd_tests results/ccd-gate | tee ipc-ccd-gate.log
          ctest --test-dir build-ipc -R pinned_official_ipc_continuous_CCD_coverage --output-on-failure
      - name: Check raw CCD audit coverage
        run: |
          python - <<'PY'
          import csv, pathlib
          p=pathlib.Path("results/ccd-gate")
          lines=list(csv.DictReader((p/"ccd_cases.csv").open()))
          assert len(lines)==35,len(lines)
          assert all(int(x["total_events"])==int(x["exhaustive_events"]) for x in lines)
          by_name={x["case_name"]:x for x in lines}
          for k in ("VF_TRUE_MIDSTEP","EE_TRUE_MIDSTEP","VF_TRUE_ASYMMETRIC"):
              assert int(by_name[k]["total_events"])>0,k
          for k in ("VF_BOX_FALSE_POSITIVE","VF_DISJOINT_Z","EE_SEPARATE_Y",
                    "EE_TIME_ALIAS_NO_COLLISION"):
              assert int(by_name[k]["total_events"])==0,k
          assert (p/"linear_vertex_paths.csv").is_file()
          print("PASS: actual upstream narrow-phase CCD, analytic fixtures, exhaustive feature enumeration")
          PY
      - name: Audit true solver-derived 3D hyperelastic trajectories with IPC
        run: |
          set -o pipefail
          ./build-ipc/kyoto_official_ipc_solid_audit results/ipc-solid-audit | tee ipc-solid-audit.log
      - name: Verify external solver-motion audit provenance
        run: |
          python - <<'PY'
          import pathlib, json, csv, math
          root=pathlib.Path("results/ipc-solid-audit")
          m=json.loads((root/"manifest.json").read_text())
          assert m["external_reference"]=="ACTUAL_PINNED_IPC_TOOLKIT_1.6.1"
          assert m["total_solver_steps"]==900 and m["sampled_steps"]>=50
          assert not m["all_900_steps_independently_CCD_audited"]
          assert not m["self_contact_is_resolved_by_solver"]
          data=list(csv.DictReader((root/"official_ipc_on_real_fem.csv").open()))
          assert len(data)==m["sampled_steps"]
          assert all(float(x["analytic_min_height_m"])>=-1e-12 for x in data)
          assert all(math.isfinite(float(x["ipc_build_query_ms"])) for x in data)
          print("PASS: actual IPC Toolkit audited physically integrated 3D FEM, self-contact explicitly disclosed")
          PY
      - name: Install visualization dependencies for real CCD evidence
        run: python -m pip install numpy==2.2.6 matplotlib==3.10.7 pandas==2.3.3
      - name: Plot actual upstream CCD over physically integrated FEM
        run: python scripts/render_ipc_solid_audit.py --input results/ipc-solid-audit --output results/ipc-solid-audit/visuals
      - name: Validate physics audit scientific figure provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          d=Path("results/ipc-solid-audit/visuals")
          charts=list(d.glob("[0-9][0-9]_*.png"))
          assert len(charts)==5,charts
          assert (d/"AUDIT_SUMMARY.md").stat().st_size>100
          print("PASS: five actual-IPC-to-real-FEM science figures and explicit self-contact disclosure")
          PY
      - name: Render real-upstream CCD geometry and proof atlas
        run: python scripts/render_real_ccd_lab.py --input results/ccd-gate --output results/ccd-gate/visuals
      - name: Check visualization completeness
        run: |
          python - <<'PY'
          from pathlib import Path
          d=Path("results/ccd-gate/visuals")
          charts=list(d.glob("[0-9][0-9]_*.png"))
          assert len(charts)==5,charts
          assert min(f.stat().st_size for f in charts)>10000
          print("PASS: five C++ source-backed upstream CCD scientific figures")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-real-ipc-v161-continuous-ccd-evidence
          path: |
            results/ccd-gate/
            results/ipc-solid-audit/
            ipc-solid-audit.log
            ipc-ccd-gate.log
            ipc-lbvh-coverage.log
          if-no-files-found: ignore
          retention-days: 30

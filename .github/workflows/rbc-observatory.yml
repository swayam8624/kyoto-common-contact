name: RBC benchmark observatory - Python source and evidence parser

on:
  push:
    paths:
      - "scripts/rbc_benchmark_observatory.py"
      - "tests/test_rbc_benchmark_observatory.py"
      - ".github/workflows/rbc-observatory.yml"
  pull_request:
    paths:
      - "scripts/rbc_benchmark_observatory.py"
      - "tests/test_rbc_benchmark_observatory.py"
      - ".github/workflows/rbc-observatory.yml"
  workflow_dispatch:

jobs:
  validate-offline-observatory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile the source
        run: python3 -m py_compile scripts/rbc_benchmark_observatory.py tests/test_rbc_benchmark_observatory.py
      - name: Verify receipt checking and offline chart data
        run: python3 -m unittest discover -s tests -p 'test_rbc_benchmark_observatory.py' -v

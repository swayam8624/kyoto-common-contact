name: RBC Stage 2 - 54 immutable full-pair replays and real contact solver
on:
  push:
    branches:
      - research/reach-budget-calculus
    paths:
      - '.github/workflows/rbc-stage2-native.yml'
      - 'include/ccp/rbc/**'
      - 'include/ccp/research_multicloth.hpp'
      - 'src/research_multicloth.cpp'
      - 'apps/rbc_material_tournament.cpp'
      - 'apps/rbc_coupled_tournament.cpp'
      - 'scripts/run_rbc_research_gate.py'
      - 'CMakeLists.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-real-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen original V4 is untouched
        run: |
          set -euo pipefail
          git fetch origin research/kyoto-decision-coverage:refs/remotes/origin/research/kyoto-decision-coverage
          git diff --exit-code origin/research/kyoto-decision-coverage -- include/ccp/final_broadphase.hpp
      - name: Compile real source generator, five-arm replay and physical solver
        run: |
          set -euo pipefail
          cmake -S . -B build/rbc-stage2-ci \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/rbc-stage2-ci --parallel 3 \
            --target ccp_material_export ccp_rbc_material_tournament \
                     ccp_rbc_coupled_tournament ccp_rbc_spatial_frontier_tests \
                     ccp_rbc_flat_frontier_tests
          ctest --test-dir build/rbc-stage2-ci -R 'rbc_(indexed|flat)' --output-on-failure
      - name: Execute 54 independent seeded SIX-METHOD full-pair AABB streams and nine FIVE-POLICY coupled physics scenes
        run: |
          set -euo pipefail
          python3 scripts/run_rbc_research_gate.py \
            --exporter build/rbc-stage2-ci/ccp_material_export \
            --replayer build/rbc-stage2-ci/ccp_rbc_material_tournament \
            --coupled build/rbc-stage2-ci/ccp_rbc_coupled_tournament \
            --output output/rbc-stage2-native-54 \
            --materials cloth sponge cushion soft_ball spring mixed \
            --regimes rapid --budgets 128 512 1024 \
            --variants 3 --frames 60 --warmup 8 --skin 0.045 \
            --coupled-frames 60 --coupled-variants 3 \
            --coupled-scenarios free pull fold --audit-coupled 0 \
            --timeout 600
      - name: Independent audit of all five RBC solver queries, not a timed speedup benchmark
        run: |
          set -euo pipefail
          build/rbc-stage2-ci/ccp_rbc_coupled_tournament \
            output/rbc-stage2-strict-fold-16.csv 16 fold 73013 86011 1 \
            > output/rbc-stage2-strict-fold-16.log
          PYTHONPATH=scripts python3 - <<'PY'
          from pathlib import Path
          import json
          from run_rbc_research_gate import validate_physics
          root=Path('output/rbc-stage2-native-54')
          r=json.loads((root/'RBC_RESULTS.json').read_text())
          assert len(r['native_material_scenes'])==54
          assert len(r['coupled_physical_scenes'])==9
          assert r['source_total_material_frames']==54*60
          assert r['source_total_physical_frames']==9*60
          assert all(s['result']['all_five_pair_streams_equal_fresh_sap_on_every_frame']
                     for s in r['native_material_scenes'])
          assert all(s['result']['all_sap_reference_particle_states_equal']
                     for s in r['coupled_physical_scenes'])
          strict=validate_physics(Path('output/rbc-stage2-strict-fold-16.csv'),
                                  16,'fold',73013,86011,True)
          assert strict['rbc_strict_oracle_queries']==16*5
          assert strict['rbc_flat_strict_oracle_queries']==16*5
          assert strict['all_sap_reference_particle_states_equal']
          print("PASS: 54x60 six-method native FULL PAIRS and 9x60 five-policy real physics parity")
          print("PASS: 160 independent exact RBC indexed+flat solver-query oracle checks")
          PY
      - name: Preserve fully inspectable original binary inputs and native outputs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-rbc-stage2-54-material-9-physical-original-native-evidence
          path: |
            output/rbc-stage2-native-54/
            output/rbc-stage2-strict-fold-16.csv
            output/rbc-stage2-strict-fold-16.log
          if-no-files-found: warn
          compression-level: 6

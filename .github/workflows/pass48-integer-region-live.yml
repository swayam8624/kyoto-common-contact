name: Pass 48 exact region and fresh FEM parity
on:
  push:
    branches: [research/pass48-integer-region-live]
  pull_request:
    paths:
      - 'tools/pass48*'
      - '.github/workflows/pass48-integer-region-live.yml'
  workflow_dispatch:
jobs:
  validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 casadi==3.7.2
      - run: |
          PYTHONPATH=tools python -c "from pass48_replay import controls; r=controls(); print(r); assert r['total']==662 and r['mismatch']==0"
          python tools/pass48_live.py live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass48-live-${{ matrix.os }}
          path: live/
          if-no-files-found: error

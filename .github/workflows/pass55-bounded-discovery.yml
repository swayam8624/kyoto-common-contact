name: Pass 55 bounded compiled discovery models
on:
  push:
    branches: [research/pass55-bounded-discovery]
  pull_request:
    paths:
      - 'tools/pass55*'
      - '.github/workflows/pass55-bounded-discovery.yml'
  workflow_dispatch:
jobs:
  paired:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        geometry: [vertex, replica8, u78, comb120, u156]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 casadi==3.7.2
      - run: python tools/pass55_benchmark.py paired --kinds ${{ matrix.geometry }} --blocks 2 --capacity 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass55-${{ matrix.os }}-${{ matrix.geometry }}
          path: paired/
          if-no-files-found: error

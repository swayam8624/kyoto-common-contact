name: CBP 1000-world crowded and contact-wave stress
on:
  push:
    branches:
      - research/common-broadphase-orchestrator
    paths:
      - '.github/workflows/cbp-mass-contact.yml'
  workflow_dispatch:

jobs:
  contact-intensive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build exact large-material source and run independent cross-pair smoke
        timeout-minutes: 5
        run: |
          cmake --preset kyoto-final-cpu
          cmake --build build/kyoto-final-cpu --target ccp_cbp_mass_export ccp_cbp_mass_replay --parallel 2
          ctest --test-dir build/kyoto-final-cpu -R '^cbp_many_material_worlds_contract$' --output-on-failure
      - name: 1000 independently stepped Worlds, 96 crowded frames
        timeout-minutes: 11
        run: |
          python3 scripts/run_cbp_mass_scale.py --build build/kyoto-final-cpu --output build/cbp-crowded-worlds --instances 1000 --frames 96 --seed 45001 --layout crowded --case-timeout 600
      - name: 1000 independently stepped Worlds, 120 moving contact-wave frames
        timeout-minutes: 11
        run: |
          python3 scripts/run_cbp_mass_scale.py --build build/kyoto-final-cpu --output build/cbp-wave-worlds --instances 1000 --frames 120 --seed 45002 --layout collision_wave --case-timeout 600
      - name: Inspect exact cross-instance candidate fractions and observed timings
        if: success()
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          for stem in ('crowded','wave'):
              root=Path('build/cbp-'+stem+'-worlds')
              record=json.loads((root/'MANIFEST.json').read_text())
              case=record['cases'][0]
              name=case['case']
              rows=list(csv.DictReader((root/name/'cpu-core.csv').open()))
              ref=[x for x in rows if x['mode']=='sap_rebuild']
              first,last=ref[0],ref[-1]
              total=sum(int(x['pairs']) for x in ref)
              cross=sum(int(x['inter_instance_pairs']) for x in ref)
              print('SCENE:',stem,'worlds:',case['instances'],'AABBs:',case['primitive_AABBs'],'frames:',case['frames'])
              print('Total framewise candidates:',total,'inter-instance:',cross,'fraction:',round(cross/total,4) if total else 'none')
              print('Cross-instance early/late:',first['inter_instance_pairs'],last['inter_instance_pairs'])
              means={m['mode']:m['mean_ms'] for m in case['cpu_methods']}
              for mode,value in means.items():
                  print('BENCHMARK',mode,round(value,6),'ms, speedup vs V4:',round(means['frozen_v4']/value,4))
          PY
      - name: Preserve unmodified raw geometry, exact pair tables and visuals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbp-1000-crowded-and-contact-wave
          path: |
            build/cbp-*-worlds/MANIFEST.json
            build/cbp-*-worlds/**/CASE_REPORT.json
            build/cbp-*-worlds/**/cpu-core.csv
            build/cbp-*-worlds/**/preview.jsonl
            build/cbp-*-worlds/**/instances.csv
            build/cbp-*-worlds/**/frames.csv
            build/cbp-*-worlds/**/dashboard.html
            build/cbp-wave-worlds/**/snapshots.kmcb
          retention-days: 7
          if-no-files-found: warn

name: Kyoto Phase 17 — restore all policies and prove materialized pair parity
on:
  push:
    branches:
      - research/kyoto-phase17-unified-proof
    paths:
      - '.github/workflows/kyoto-phase17-unified-evidence.yml'
      - 'scripts/verify_cbp_materialized_pairs.py'
      - 'scripts/kyoto_research_dashboard.py'
      - 'scripts/render_kyoto_phase17_html.py'
      - 'scripts/test_kyoto_phase17.py'
      - 'scripts/run_kyoto_phase17.sh'
      - 'apps/cbp_pressure_incremental_flat_emit.cpp'
      - 'include/ccp/cbp_pressure_incremental_flat.hpp'
      - 'tests/cbp_pressure_incremental_flat_tests.cpp'
      - 'CMakeLists.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase17-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KYOTO_PHASE17_BUILD: build/kyoto-phase17-ci
      KYOTO_PHASE17_FRAMES: 10
      KYOTO_PHASE17_BUDGET: 128
      KYOTO_PHASE17_MATERIALS: cloth sponge
      KYOTO_PHASE17_REGIMES: baseline shear
      KYOTO_PHASE17_PRESSURE_N: 512
      KYOTO_PHASE17_PRESSURE_FRAMES: 3
      KYOTO_PHASE17_SCENES: slabs burst bridge all_overlap
      KYOTO_PHASE17_THREADS: '1 4'
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax and deliberately corrupted-evidence regressions
        run: |
          python3 -m py_compile scripts/verify_cbp_materialized_pairs.py scripts/kyoto_research_dashboard.py scripts/test_kyoto_phase17.py scripts/render_kyoto_phase17_html.py
          python3 scripts/test_kyoto_phase17.py
          bash -n scripts/run_kyoto_phase17.sh
      - name: Native full-pair replay plus independent pair materialization proof
        run: |
          bash scripts/run_kyoto_phase17.sh output/phase17-ci-evidence
          test -s output/phase17-ci-evidence/reports/KYOTO_METHODS_OFFLINE.html
          grep -q 'Original Online' output/phase17-ci-evidence/reports/KYOTO_METHODS_OFFLINE.html
          grep -q 'Global Guard' output/phase17-ci-evidence/reports/KYOTO_METHODS_OFFLINE.html
          grep -q 'V4 Guard' output/phase17-ci-evidence/reports/KYOTO_METHODS_OFFLINE.html
      - name: Preserve separate benchmark cohorts and integrity receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-phase17-unified-proof
          path: |
            output/phase17-ci-evidence/reports/
            output/phase17-ci-evidence/pair-proofs/
            output/phase17-ci-evidence/replays/
            output/phase17-ci-evidence/phase16/
          retention-days: 14
          if-no-files-found: warn

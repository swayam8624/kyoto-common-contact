name: CBP exact spatial index regressions
on:
  push:
    branches: [research/common-broadphase-orchestrator]
  pull_request:
    paths:
      - 'include/ccp/cbp_region_router.hpp'
      - 'tests/cbp_region_router_tests.cpp'
      - 'tests/cbp_region_sweep_tests.cpp'
      - 'scripts/analyze_cbp_topology.py'
      - 'tests/cbp_shared_bvh_tests.cpp'
      - 'tests/cbp_certified_cache_tests.cpp'
      - 'apps/cbp_cross_microbench.cpp'
      - 'include/ccp/cbp_certified_cache.hpp'
      - 'include/ccp/cbp_cost_manager.hpp'
      - 'include/ccp/cbp_portfolio.hpp'
      - 'tests/cbp_portfolio_tests.cpp'
      - 'scripts/analyze_cbp_pilot.py'
      - 'tests/cbp_cost_manager_tests.cpp'
      - 'apps/cbp_kmcb_replay.cpp'
      - 'apps/cbp_topology_replay.cpp'
      - 'scripts/test_cbp_topology_replay.py'
      - 'scripts/test_cbp_kmcb_smoke.py'
      - 'apps/cbp_manager_microbench.cpp'
      - 'include/ccp/cbp_spatial_index.hpp'
      - 'include/ccp/cbp_region_router.hpp'
      - '.github/workflows/cbp-phase0.yml'
      - 'CMakeLists.txt'
  workflow_dispatch:

jobs:
  exact-regional-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact regional router regression (C++23, no solver dependencies)
        run: |
          c++ -std=c++23 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Iinclude tests/cbp_region_router_tests.cpp -o /tmp/cbp-region-tests
          /tmp/cbp-region-tests
      - name: Exact X-swept region join regression (optimized Werror)
        run: |
          c++ -std=c++23 -O2 -Wall -Wextra -Wpedantic -Werror -Iinclude tests/cbp_region_sweep_tests.cpp -o /tmp/cbp-region-sweep-tests
          /tmp/cbp-region-sweep-tests
      - name: Build and run shared BVH oracle (optimized Werror)
        run: |
          c++ -std=c++23 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Iinclude tests/cbp_shared_bvh_tests.cpp -o /tmp/cbp-bvh-tests
          /tmp/cbp-bvh-tests
      - name: Build and run certified potential-graph oracle (optimized Werror)
        run: |
          c++ -std=c++23 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Iinclude tests/cbp_certified_cache_tests.cpp -o /tmp/cbp-cert-tests
          /tmp/cbp-cert-tests
      - name: Compile short A/B benchmark (not a performance gate)
        run: |
          c++ -std=c++23 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Iinclude apps/cbp_cross_microbench.cpp -o /tmp/cbp-bench
          /tmp/cbp-bench 64 24 > /tmp/cbp-bench-smoke.csv
          test "$(wc -l < /tmp/cbp-bench-smoke.csv)" -eq 10
      - name: Bounded 256-primitive diagnostic (not a performance gate)
        timeout-minutes: 2
        run: |
          /tmp/cbp-bench 256 64 > /tmp/cbp-bench-256.csv
          cat /tmp/cbp-bench-256.csv
      - name: Causal single-backend manager independent oracle (Werror)
        run: |
          c++ -std=c++23 -O2 -Wall -Wextra -Wpedantic -Werror             -Iinclude tests/cbp_cost_manager_tests.cpp -o /tmp/cbp-manager-tests
          /tmp/cbp-manager-tests
      - name: Bounded in-scene transitions (four exact methods)
        timeout-minutes: 2
        run: |
          c++ -std=c++23 -O2 -Wall -Wextra -Wpedantic -Werror             -Iinclude apps/cbp_manager_microbench.cpp -o /tmp/cbp-manager-bench
          /tmp/cbp-manager-bench 128 16 > /tmp/cbp-manager-smoke.csv
          test "$(wc -l < /tmp/cbp-manager-smoke.csv)" -eq 25
          cat /tmp/cbp-manager-smoke.csv
      - name: Bounded 256-object transition comparison (diagnostic only)
        timeout-minutes: 3
        run: |
          /tmp/cbp-manager-bench 256 24 > /tmp/cbp-manager-256.csv
          test "$(wc -l < /tmp/cbp-manager-256.csv)" -eq 25
          cat /tmp/cbp-manager-256.csv
      - name: Frozen V4 fallback portfolio exact regression
        timeout-minutes: 2
        run: |
          c++ -std=c++23 -O2 -Wall -Wextra -Wpedantic -Werror             -Iinclude tests/cbp_portfolio_tests.cpp src/live_cloth.cpp             -o /tmp/cbp-portfolio-tests
          /tmp/cbp-portfolio-tests
      - name: KYOTOM01 material replay seven-method exactness and trace contract
        timeout-minutes: 3
        run: |
          c++ -std=c++23 -O2 -Wall -Wextra -Wpedantic             -Iinclude apps/cbp_kmcb_replay.cpp src/live_cloth.cpp -o /tmp/cbp-kmcb-replay
          python3 scripts/test_cbp_kmcb_smoke.py /tmp/cbp-kmcb-replay
      - name: CMake target integration for CBP manager and material replay
        timeout-minutes: 3
        run: |
          cmake --preset kyoto-final-cpu
          cmake --build build/kyoto-final-cpu --target ccp_cbp_cost_manager_tests ccp_cbp_portfolio_tests ccp_cbp_region_sweep_tests ccp_cbp_kmcb_replay ccp_cbp_topology_replay --parallel 2
          ctest --test-dir build/kyoto-final-cpu -R 'cbp_(causal_manager_oracle|portfolio_fallback_oracle|region_sweep_oracle|kmcb_snapshot_contract|mesh_topology_replay_contract)' --output-on-failure
      - name: Topology-authentic four-span same-geometry ablation (diagnostic only)
        timeout-minutes: 4
        run: |
          mkdir -p build/kyoto-final-cpu/cbp-evidence
          for span in 1 3 6 12; do
            build/kyoto-final-cpu/ccp_cbp_topology_replay \
              build/kyoto-final-cpu/cbp-evidence/two-cloth-span${span}.csv 2 1 24 ${span}
          done
          python3 scripts/analyze_cbp_topology.py \
            build/kyoto-final-cpu/cbp-evidence/two-cloth-span1.csv \
            build/kyoto-final-cpu/cbp-evidence/two-cloth-span3.csv \
            build/kyoto-final-cpu/cbp-evidence/two-cloth-span6.csv \
            build/kyoto-final-cpu/cbp-evidence/two-cloth-span12.csv \
            --html build/kyoto-final-cpu/cbp-evidence/report.html
      - name: ASan and UBSan adversarial regression
        run: |
          c++ -std=c++23 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Iinclude \
            tests/cbp_region_router_tests.cpp -o /tmp/cbp-region-sanitizers
          /tmp/cbp-region-sanitizers
          c++ -std=c++23 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Iinclude \
            tests/cbp_shared_bvh_tests.cpp -o /tmp/cbp-bvh-sanitizers
          /tmp/cbp-bvh-sanitizers
          c++ -std=c++23 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Iinclude \
            tests/cbp_certified_cache_tests.cpp -o /tmp/cbp-cert-sanitizers
          /tmp/cbp-cert-sanitizers
          c++ -std=c++23 -O1 -g -fsanitize=address,undefined             -fno-omit-frame-pointer -Iinclude             tests/cbp_cost_manager_tests.cpp -o /tmp/cbp-manager-sanitizers
          /tmp/cbp-manager-sanitizers
          c++ -std=c++23 -O1 -g -fsanitize=address,undefined             -fno-omit-frame-pointer -Iinclude tests/cbp_portfolio_tests.cpp             src/live_cloth.cpp -o /tmp/cbp-portfolio-sanitizers
          /tmp/cbp-portfolio-sanitizers

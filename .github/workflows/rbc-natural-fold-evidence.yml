name: RBC natural same-sheet over-fold challenge (real solver)
on:
  push:
    branches:
      - research/reach-budget-calculus
    paths:
      - '.github/workflows/rbc-natural-fold-evidence.yml'
      - 'apps/rbc_coupled_tournament.cpp'
      - 'src/research_multicloth.cpp'
      - 'include/ccp/research_multicloth.hpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-solver-overfold:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check frozen historical V4 is unchanged and compile FIVE actual solver policies
        run: |
          set -euo pipefail
          git fetch origin research/kyoto-decision-coverage:refs/remotes/origin/research/kyoto-decision-coverage
          git diff --exit-code origin/research/kyoto-decision-coverage -- include/ccp/final_broadphase.hpp
          cmake -S . -B build/rbc-fold-ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/rbc-fold-ci --parallel 3 \
            --target ccp_rbc_coupled_tournament \
                     ccp_rbc_flat_frontier_tests ccp_rbc_spatial_frontier_tests
          ctest --test-dir build/rbc-fold-ci \
            -R 'rbc_(flat|indexed_spatial)' --output-on-failure
      - name: Exercise three true NON-TELEPORTING, bottom-grab, 150-frame same-sheet over-fold physical scenarios
        run: |
          set -euo pipefail
          mkdir -p output/rbc-natural-fold-coupled-150
          build/rbc-fold-ci/ccp_rbc_coupled_tournament \
            output/rbc-natural-fold-coupled-150/foldover-g73013-t86011.csv \
            150 fold_over 73013 86011 0 \
            > output/rbc-natural-fold-coupled-150/g73013.log
          build/rbc-fold-ci/ccp_rbc_coupled_tournament \
            output/rbc-natural-fold-coupled-150/foldover-g74017-t86019.csv \
            150 fold_over 74017 86019 0 \
            > output/rbc-natural-fold-coupled-150/g74017.log
          build/rbc-fold-ci/ccp_rbc_coupled_tournament \
            output/rbc-natural-fold-coupled-150/foldover-g75029-t86029.csv \
            150 fold_over 75029 86029 0 \
            > output/rbc-natural-fold-coupled-150/g75029.log
      - name: Verify every original particle state and actual self contact counter on EVERY frame; report negative results
        run: |
          python3 - <<'PY'
          import csv,hashlib,json,math,statistics
          from collections import defaultdict
          from pathlib import Path
          root=Path('output/rbc-natural-fold-coupled-150')
          methods={'sap_rebuild','global_guard','frozen_v4','rbc_indexed','rbc_flat'}
          outcomes=[]
          for p in sorted(root.glob('foldover-*.csv')):
              with p.open(newline='') as f:
                  rows=list(csv.DictReader(f))
              assert len(rows)==150*5
              by=defaultdict(list)
              slots=defaultdict(set)
              for row in rows:
                  name=row['policy'];t=int(row['frame'])
                  assert name in methods and 0<=t<150
                  assert row['scenario']=='fold_over'
                  assert int(row['oracle_misses'])==0
                  assert float(row['max_position_diff_sap'])<=1e-7
                  assert math.isfinite(float(row['step_ms']))
                  assert int(row['self_contacts'])>=0
                  assert int(row['sphere_contacts'])>=0
                  by[name].append(row)
                  slots[t].add(int(row['execution_slot']))
              assert set(by)==methods
              assert all([int(r['frame']) for r in by[m]]==list(range(150))
                         for m in methods)
              assert all(s==set(range(5)) for s in slots.values())
              summary={'source':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
              for method in sorted(methods):
                  subset=by[method]
                  summary[method]={
                    'actual_self_contacts':sum(int(r['self_contacts']) for r in subset),
                    'actual_sphere_contacts':sum(int(r['sphere_contacts']) for r in subset),
                    'mean_full_step_ms':statistics.mean(float(r['step_ms']) for r in subset[8:]),
                    'peak_edge_stretch':max(float(r['max_stretch']) for r in subset),
                    'contact_query_frames':len(subset),
                    'no_sap_particle_state_divergence':True
                  }
              outcomes.append(summary)
          assert len(outcomes)==3
          p=root/'FOLDOVER_PHYSICS_RESULTS.json'
          p.write_text(json.dumps({
              'study':'natural barycentric fold_over, three 150-frame cases',
              'one_session_only':True,
              'self_contact_is_actual_solver_counter_not_inferred':True,
              'no_cloth_contact_guarantee_assumed':True,
              'results':outcomes},indent=2)+'\n')
          print(json.dumps(outcomes,indent=2))
          PY
      - name: Preserve real framewise solver evidence even when self contact is zero
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-rbc-real-150-frame-barycentric-overfold-coupled-solver
          path: output/rbc-natural-fold-coupled-150/
          if-no-files-found: warn

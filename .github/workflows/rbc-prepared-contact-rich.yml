name: RBC prepared self-fold contact-rich five-policy physics challenge
on:
  push:
    branches:
      - research/reach-budget-calculus
    paths:
      - '.github/workflows/rbc-prepared-contact-rich.yml'
      - 'src/research_multicloth.cpp'
      - 'include/ccp/research_multicloth.hpp'
      - 'apps/rbc_coupled_tournament.cpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-true-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Ensure frozen V4 still unchanged and compile actual five policy solver
        run: |
          set -euo pipefail
          git fetch origin research/kyoto-decision-coverage:refs/remotes/origin/research/kyoto-decision-coverage
          git diff --exit-code origin/research/kyoto-decision-coverage -- include/ccp/final_broadphase.hpp
          cmake -S . -B build/rbc-prefold-ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/rbc-prefold-ci --parallel 3 \
            --target ccp_rbc_coupled_tournament \
                     ccp_rbc_spatial_frontier_tests ccp_rbc_flat_frontier_tests
          ctest --test-dir build/rbc-prefold-ci -R 'rbc_(indexed_spatial|flat)' --output-on-failure
      - name: Run 3 real initially folded cloth physical scenes under 5 independent policies, with NO fake self contact numbers
        run: |
          set -euo pipefail
          mkdir -p output/rbc-prepared-fold-contact-rich
          build/rbc-prefold-ci/ccp_rbc_coupled_tournament \
            output/rbc-prepared-fold-contact-rich/prefold-g73013-t86011.csv \
            80 prefold_relax 73013 86011 0 \
            output/rbc-prepared-fold-contact-rich/mesh-g73013 \
            > output/rbc-prepared-fold-contact-rich/g73013.log
          build/rbc-prefold-ci/ccp_rbc_coupled_tournament \
            output/rbc-prepared-fold-contact-rich/prefold-g74017-t86019.csv \
            80 prefold_relax 74017 86019 0 \
            > output/rbc-prepared-fold-contact-rich/g74017.log
          build/rbc-prefold-ci/ccp_rbc_coupled_tournament \
            output/rbc-prepared-fold-contact-rich/prefold-g75029-t86029.csv \
            80 prefold_relax 75029 86029 0 \
            > output/rbc-prepared-fold-contact-rich/g75029.log
      - name: Audit genuine nonlocal same-sheet contact corrections, full policy state parity and all recorded source SHA receipts
        run: |
          python3 - <<'PY'
          import csv,hashlib,json,math,statistics
          from collections import defaultdict
          from pathlib import Path
          root=Path('output/rbc-prepared-fold-contact-rich')
          methods={'sap_rebuild','global_guard','frozen_v4','rbc_indexed','rbc_flat'}
          cases=[]
          for source in sorted(root.glob('prefold-*.csv')):
              with source.open(newline='') as fd:
                  rows=list(csv.DictReader(fd))
              assert len(rows)==80*5
              grouped=defaultdict(list)
              for row in rows:
                  assert row['policy'] in methods
                  assert row['scenario']=='prefold_relax'
                  assert int(row['oracle_misses'])==0
                  assert float(row['max_position_diff_sap'])<=1e-7
                  assert math.isfinite(float(row['step_ms']))
                  grouped[row['policy']].append(row)
              assert set(grouped)==methods
              assert all([int(r['frame']) for r in grouped[k]]==list(range(80))
                         for k in methods)
              by_method={}
              for method in sorted(methods):
                  values=grouped[method]
                  by_method[method]={
                      'actual_nonlocal_self_contacts':sum(int(r['self_contacts']) for r in values),
                      'actual_sphere_contacts':sum(int(r['sphere_contacts']) for r in values),
                      'actual_self_crossings':sum(int(r['self_crossings']) for r in values),
                      'mean_full_step_ms_after_8':statistics.mean(
                           float(r['step_ms']) for r in values[8:]),
                      'peak_edge_stretch':max(float(r['max_stretch']) for r in values),
                      'all_particle_states_equal_sap':True,
                  }
              # This is an explicit physical contact-rich STRESS FIXTURE,
              # not spontaneous natural folding from a flat starting state.
              assert by_method['sap_rebuild']['actual_nonlocal_self_contacts']>0, (
                  'Prepared folded actual solver generated ZERO nonlocal self contacts; '
                  'do NOT claim contact-rich physics until fixed')
              assert all(by_method[m]['actual_nonlocal_self_contacts']==
                         by_method['sap_rebuild']['actual_nonlocal_self_contacts']
                         for m in methods)
              cases.append({'source':source.name,
                            'source_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),
                            'initial_geometry':'deliberately PRE-FOLDED real sheet with unchanged flat rest constraints',
                            'methods':by_method})
          assert len(cases)==3
          # The opt-in geometry is ACTUAL solver state, not a render
          # guessed from force inputs or a fake cloth animation.
          import json as _json
          meshdir=root/'mesh-g73013'
          assert meshdir.is_dir()
          visual={}
          for policy in methods:
              source=meshdir/(policy+'.jsonl')
              assert source.is_file()
              lines=[_json.loads(x) for x in source.read_text().splitlines()]
              assert len(lines)==81
              header=lines[0]
              assert header['type']=='mesh_header'
              assert header['schema']==2
              assert header['source_is_prepared_initial_fold'] is True
              assert len(header['triangles'])>0
              assert len(header['triangle_sheets'])==len(header['triangles'])
              frames=lines[1:]
              assert [f['frame'] for f in frames]==list(range(80))
              assert all(len(f['positions'])==len(header['initial_positions'])
                         for f in frames)
              assert all(len(f['spheres'])==2 for f in frames)
              assert all(f['metrics']['source_max_position_error_sap']<=1e-7
                         for f in frames)
              visual[policy]={'header':header,'frames':frames}
          sap=visual['sap_rebuild']
          for policy in methods-{'sap_rebuild'}:
              current=visual[policy]
              assert current['header']['triangles']==sap['header']['triangles']
              assert current['header']['initial_positions']==sap['header']['initial_positions']
              for f,g in zip(current['frames'],sap['frames']):
                  # Serialized decimal positions may differ by sub-1e-7
                  # due to method evaluation order; compare geometry
                  # numerically, not lexically.
                  assert all(max(abs(a-b) for a,b in zip(p,q))<=1e-7
                             for p,q in zip(f['positions'],g['positions']))
                  assert f['metrics']['self_contacts']==g['metrics']['self_contacts']
          print('PASS: 5 x 80 original source-backed mesh frames, two moving spheres, identical trajectories and actual nonlocal self-contact counters')
          (root/'PREPARED_TRUE_SELF_CONTACT_RESULTS.json').write_text(
              json.dumps({'actual_native_contact_corrections_verified':True,
                          'no_naturally_generated_flat_sheet_fold_claim':True,
                          'no_continuous_collision_or_penetration_proof':True,
                          'independent_source_scenes':3,'cases':cases},indent=2)+'\n')
          print('PASS: 3 real pre-folded same-sheet physical sources with actual contact corrections; all 5 independent solver policy trajectories identical')
          print(json.dumps(cases,indent=2))
          PY
      - name: Preserve original five-method solver CSVs even for negative/failure case
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-rbc-three-initially-prefolded-real-self-contact-physics
          path: output/rbc-prepared-fold-contact-rich/
          if-no-files-found: warn

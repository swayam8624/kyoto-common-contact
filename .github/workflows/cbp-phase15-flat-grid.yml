name: CBP Phase 15 — cache-local flat persistent grid vs pointer-heavy control at 1M objects
on:
  push:
    branches:
      - research/common-broadphase-orchestrator
    paths:
      - '.github/workflows/cbp-phase15-flat-grid.yml'
      - 'include/ccp/cbp_pressure_incremental_flat.hpp'
      - 'apps/cbp_pressure_incremental_flat_cpu.cpp'
      - 'tests/cbp_pressure_incremental_flat_tests.cpp'
      - 'scripts/test_cbp_pressure_incremental_flat.py'
      - 'scripts/analyze_cbp_pressure_incremental_flat.py'
      - 'CMakeLists.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flat:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Build three independently measured exact spatial indexing strategies
        run: |
          cmake --preset kyoto-final-cpu
          cmake --build build/kyoto-final-cpu \
            --target ccp_cbp_pressure_cpu ccp_cbp_pressure_incremental_cpu \
                     ccp_cbp_pressure_incremental_flat_cpu \
                     ccp_cbp_pressure_incremental_flat_tests --parallel 2
          python3 -m py_compile scripts/test_cbp_pressure_incremental_flat.py scripts/analyze_cbp_pressure_incremental_flat.py
      - name: Direct exact 160-frame brute oracle and independent eight-scenario CSV evidence
        run: |
          ctest --test-dir build/kyoto-final-cpu \
            -R '^cbp_flat_persistent_cell_(direct|independent)_oracle$' \
            --output-on-failure
      - name: Million AABBs slabs — full build, quiet-frame reuse and cache-local traversal
        timeout-minutes: 4
        run: |
          mkdir -p build/phase15-flat
          build/kyoto-final-cpu/ccp_cbp_pressure_incremental_flat_cpu \
            build/phase15-flat/slabs-flat.csv \
            slabs 1000000 6 95377 300000000 25000 12000000
          build/kyoto-final-cpu/ccp_cbp_pressure_incremental_cpu \
            build/phase15-flat/slabs-pointer.csv \
            slabs 1000000 6 95377 300000000 25000 12000000
          build/kyoto-final-cpu/ccp_cbp_pressure_cpu \
            build/phase15-flat/slabs-frozen.csv \
            slabs 1000000 6 95377 300000000 25000 12000000
          python3 scripts/analyze_cbp_pressure_incremental_flat.py \
            build/phase15-flat/slabs-flat.csv build/phase15-flat/slabs-frozen.csv \
            --report build/phase15-flat/slabs-RESULTS.md
      - name: Million AABBs burst — measured dense query and dirty/full repair
        timeout-minutes: 5
        run: |
          build/kyoto-final-cpu/ccp_cbp_pressure_incremental_flat_cpu \
            build/phase15-flat/burst-flat.csv \
            burst 1000000 20 95377 300000000 25000 12000000
          build/kyoto-final-cpu/ccp_cbp_pressure_incremental_cpu \
            build/phase15-flat/burst-pointer.csv \
            burst 1000000 20 95377 300000000 25000 12000000
          build/kyoto-final-cpu/ccp_cbp_pressure_cpu \
            build/phase15-flat/burst-frozen.csv \
            burst 1000000 20 95377 300000000 25000 12000000
          python3 scripts/analyze_cbp_pressure_incremental_flat.py \
            build/phase15-flat/burst-flat.csv build/phase15-flat/burst-frozen.csv \
            --report build/phase15-flat/burst-RESULTS.md
      - name: All 8192 overlap — exact X-work fallback and 33.55M true candidate limit
        timeout-minutes: 3
        run: |
          build/kyoto-final-cpu/ccp_cbp_pressure_incremental_flat_cpu \
            build/phase15-flat/dense-flat.csv \
            all_overlap 8192 6 95377 300000000 25000 12000000
          build/kyoto-final-cpu/ccp_cbp_pressure_cpu \
            build/phase15-flat/dense-frozen.csv \
            all_overlap 8192 6 95377 300000000 25000 12000000
          python3 scripts/analyze_cbp_pressure_incremental_flat.py \
            build/phase15-flat/dense-flat.csv build/phase15-flat/dense-frozen.csv \
            --report build/phase15-flat/dense-RESULTS.md
      - name: Compare actual contiguous versus pointer-heavy query and full index costs
        run: |
          python3 - <<'PY'
          import csv,statistics
          from pathlib import Path
          base=Path('build/phase15-flat')
          def read(p):
              with (base/p).open(newline='') as f:return list(csv.DictReader(f))
          for scene in ('slabs','burst'):
              flat=read(scene+'-flat.csv')
              pointer=read(scene+'-pointer.csv')
              assert all(x['status']=='complete' for x in flat+pointer)
              assert len(flat)==len(pointer)
              for a,b in zip(flat,pointer):
                  for f in ('exact_pairs','hash64_sum','hash64_xor','hash32_sum','hash32_xor'):
                      assert a[f]==b[f],(scene,f)
              a=statistics.fmean(float(x['complete_query_ms']) for x in flat[1:])
              b=statistics.fmean(float(x['complete_query_ms']) for x in pointer[1:])
              qa=statistics.fmean(float(x['query_ms']) for x in flat[1:])
              qb=statistics.fmean(float(x['query_ms']) for x in pointer[1:])
              print(f'{scene}: flat post-first full={a:.4f}ms pointer={b:.4f}ms ratio={b/a:.3f}x')
              print(f'{scene}: flat post-first enumeration={qa:.4f}ms pointer={qb:.4f}ms ratio={qb/qa:.3f}x')
              if scene=='slabs':
                  assert all(x['rebuilt']=='0' and x['changed_cell_ranges']=='0' for x in flat[1:])
              assert all(float(x['complete_query_ms'])>=float(x['query_ms']) for x in flat)
          print('PASS flat-vs-pointer exact pair parity and full-cost benchmark receipts')
          PY
      - name: Preserve all measured source frame stage breakdowns, not only summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbp-phase15-flat-vs-pointer-exact-1m
          path: build/phase15-flat
          retention-days: 14
          if-no-files-found: warn

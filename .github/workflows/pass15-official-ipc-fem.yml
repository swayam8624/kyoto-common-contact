name: Kyoto Pass 15 matched official IPC LBVH on native FEM

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [research/spacetime-contact-atlas]
    paths:
      - "apps/pass15_official_ipc_fem_benchmark.cpp"
      - "apps/pass18_real_leaf_ccd_audit.cpp"
      - "scripts/audit_pass18_real_leaf_ccd.py"
      - "include/kyoto/fem_feature_snapshots.hpp"
      - "include/kyoto/rigid_mesh_fem_contact.hpp"
      - "tests/rigid_mesh_fast_contact_tests.cpp"
      - "tests/temporal_frontier_stress_tests.cpp"
      - "tests/maintained_broadphase_fuzz_tests.cpp"
      - "tests/fem_feature_snapshots_tests.cpp"
      - "include/kyoto/refit_feature_hierarchy.hpp"
      - "include/kyoto/cached_feature_boxes.hpp"
      - "scripts/report_pass15_official_ipc.py"
      - "tests/test_pass15_aa_receipts.py"
      - ".github/workflows/pass15-official-ipc-fem.yml"
      - "CMakeLists.txt"
  workflow_dispatch:

jobs:
  official-pinned-source-pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject malformed paid A/A benchmark receipts
        run: python3 -m unittest discover -s tests -p "test_pass15_aa_receipts.py" -v
      - name: Configure REAL upstream IPC Toolkit v1.6.1 pinned by SHA
        run: |
          cmake -S . -B build-pass15 -DCMAKE_BUILD_TYPE=Release \
            -DKYOTO_WITH_OFFICIAL_IPC=ON -DIPC_TOOLKIT_WITH_SIMD=OFF
      - name: Compile matched native 3D benchmarks and independent tests
        run: |
          cmake --build build-pass15 --parallel 2 \
            --target kyoto_pass15_official_ipc_fem_benchmark \
                     kyoto_official_ipc_lbvh_tests \
                     kyoto_refit_feature_hierarchy_tests \
                     kyoto_fem_feature_snapshots_tests \
                     kyoto_fast_mesh_impact_tests \
                     kyoto_temporal_frontier_stress_tests \
                     kyoto_maintained_broadphase_fuzz_tests \
                     kyoto_pass18_real_leaf_ccd_audit
      - name: Check independent hierarchy and pinned official IPC coverage
        run: |
          ctest --test-dir build-pass15 \
            -R 'maintained_refit_hierarchy_VF_EE_oracle_and_invalidation|identical_real_FEM_feature_source_and_refit_contract|pinned_official_ipc_lbvh_feature_coverage|actual_adaptive_fast_finite_rigid_mesh_FEM_collision|retained_spacetime_pair_frontier_dense_sparse_oracle|independent_seeded_3D_feature_broadphase_fuzz|pinned_actual_fast_FEM_leaf_exhaustive_IPC_CCD_events' \
            --output-on-failure
      - name: Archive independent exhaustive real CCD evidence
        run: |
          mkdir -p results/pass15/ccd-events
          ./build-pass15/kyoto_pass18_real_leaf_ccd_audit \
            results/pass15/ccd-events | tee results/pass15/ccd-events/native_console.txt
          python3 scripts/audit_pass18_real_leaf_ccd.py \
            --input results/pass15/ccd-events/actual_fast_leaf_exhaustive_ipc_ccd.csv \
            --positive results/pass15/ccd-events/rejected_native_trial_positive_ccd.json \
            --output results/pass15/ccd-events
      - name: Generate verified original-solver matched source receipts
        run: |
          mkdir -p results/pass15/native
          ./build-pass15/kyoto_pass15_official_ipc_fem_benchmark \
            results/pass15/native | tee results/pass15/native/console.txt
      - name: Check complete paid timings and render real 3D science figures
        run: |
          python3 -m pip install matplotlib
          python3 scripts/report_pass15_official_ipc.py \
            --input results/pass15/native/official_ipc_fem_paired.csv \
            --output results/pass15/science
      - name: Paid full-trajectory real FEM refits at EVERY physical macro-step
        run: |
          mkdir -p results/pass15/full-trajectory
          ./build-pass15/kyoto_pass15_official_ipc_fem_benchmark \
            results/pass15/full-trajectory 1 4 \
            | tee results/pass15/full-trajectory/native_console.txt
          python3 scripts/report_pass15_official_ipc.py \
            --input results/pass15/full-trajectory/official_ipc_fem_paired.csv \
            --output results/pass15/full-trajectory/science
      - name: Heterogeneous genuine FEM topology material and shear comparison
        run: |
          mkdir -p results/pass15/multi-physics
          ./build-pass15/kyoto_pass15_official_ipc_fem_benchmark \
            results/pass15/multi-physics 12 4 3 \
            | tee results/pass15/multi-physics/native_console.txt
          python3 scripts/report_pass15_official_ipc.py \
            --input results/pass15/multi-physics/official_ipc_fem_paired.csv \
            --output results/pass15/multi-physics/science
      - name: Preserve original measurements and figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-pass15-official-ipc-native-fem
          path: results/pass15/
          if-no-files-found: warn

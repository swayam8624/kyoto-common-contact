name: RBC independent physical triangle penetration gate - smooth rounded fold
on:
  push:
    branches:
      - research/reach-budget-calculus
    paths:
      - '.github/workflows/rbc-geometry-physics.yml'
      - 'include/ccp/research_multicloth.hpp'
      - 'src/research_multicloth.cpp'
      - 'tests/rbc_physical_geometry_tests.cpp'
      - 'apps/rbc_coupled_tournament.cpp'
      - 'CMakeLists.txt'
      - 'scripts/render_rbc_physics_studio.py'
      - 'scripts/build_rbc_physics_viewer.py'
      - 'scripts/audit_rbc_subframe_geometry.py'
      - 'web/rbc_verified_physics_viewer_template.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Confirm frozen V4 has not been changed
        run: |
          git fetch origin research/kyoto-decision-coverage:refs/remotes/origin/research/kyoto-decision-coverage
          git diff --exit-code origin/research/kyoto-decision-coverage -- include/ccp/final_broadphase.hpp
      - name: Build REAL solver, nonintersecting fold geometry oracle
        run: |
          cmake -S . -B build/rbc-geometry-ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/rbc-geometry-ci --parallel 3 \
            --target ccp_rbc_physical_geometry_tests \
                     ccp_rbc_coupled_tournament
          ctest --test-dir build/rbc-geometry-ci \
            -R 'rbc_nonpenetrating_rounded_fold' --output-on-failure
      - name: Five independent real 80-frame physics trajectories, exact candidate/SAP state parity and STRICT NO ENDPOINT PIERCING
        run: |
          set -euo pipefail
          mkdir -p output/rbc-rounded-clean-80
          build/rbc-geometry-ci/ccp_rbc_coupled_tournament \
            output/rbc-rounded-clean-80/g73013.csv \
            80 rounded_fold_relax 73013 86011 0 \
            output/rbc-rounded-clean-80/g73013-mesh \
            > output/rbc-rounded-clean-80/g73013.log
          build/rbc-geometry-ci/ccp_rbc_coupled_tournament \
            output/rbc-rounded-clean-80/g74017.csv \
            80 rounded_fold_relax 74017 86019 0 \
            output/rbc-rounded-clean-80/g74017-mesh \
            > output/rbc-rounded-clean-80/g74017.log
          build/rbc-geometry-ci/ccp_rbc_coupled_tournament \
            output/rbc-rounded-clean-80/g75029.csv \
            80 rounded_fold_relax 75029 86029 0 \
            output/rbc-rounded-clean-80/g75029-mesh \
            > output/rbc-rounded-clean-80/g75029.log
          python3 - <<'PY'
          import csv,hashlib,json,math
          from pathlib import Path
          root=Path('output/rbc-rounded-clean-80')
          policies={'sap_rebuild','global_guard','frozen_v4','rbc_indexed','rbc_flat'}
          receipts=[]
          for source in sorted(root.glob('g*.csv')):
              with source.open(newline='') as f: rows=list(csv.DictReader(f))
              assert len(rows)==80*5
              assert {r['policy'] for r in rows}==policies
              assert all(int(r['geometric_self_intersections'])==0 for r in rows), (
                  'REAL GEOMETRIC SELF-PENETRATION: do NOT publish a clean source'
              )
              assert all(int(r['oracle_misses'])==0 for r in rows)
              assert all(float(r['max_position_diff_sap'])<=1e-7 for r in rows)
              for policy in policies:
                  subset=[r for r in rows if r['policy']==policy]
                  assert [int(r['frame']) for r in subset]==list(range(80))
              receipts.append({'source':source.name,
                'source_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),
                'independent_final_geometry_self_intersections':0})
          assert len(receipts)==3
          mesh=root/'g73013-mesh'
          for name in policies:
              lines=[json.loads(t) for t in (mesh/(name+'.jsonl')).read_text().splitlines()]
              assert len(lines)==81
              assert all(f['metrics']['geometric_self_intersections']==0
                         for f in lines[1:])
          (root/'GATE.json').write_text(json.dumps({
              'geometry_type':'prepared continuous finite-radius U-bend; NOT spontaneous dynamic fold',
              'method_count':5,'source_scene_count':3,
              'independent_solver_final_endpoint_triangle_piercing_zero':True,
              'contact_quality_not_continuous_CCD_certified':True,
              'receipts':receipts},indent=2)+'\n')
          print('PASS: 3 source variants x 80 frames x 5 REAL independent policies, zero nonlocal mesh penetrations after every solver step')
          PY
      - name: Render truly depth-tested 5-policy cloth, actual spheres and verified zero-penetration source into looping GIF
        run: |
          python3 -m pip install --quiet Pillow numpy
          python3 scripts/render_rbc_physics_studio.py \
            --mesh-dir output/rbc-rounded-clean-80/g73013-mesh \
            --output output/rbc-rounded-clean-80/FIVE_POLICY_STUDIO.gif \
            --stride 3 --fps 12
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('output/rbc-rounded-clean-80')
          movie=root/'FIVE_POLICY_STUDIO.gif'
          preview=root/'FIVE_POLICY_STUDIO.png'
          receipt=root/'FIVE_POLICY_STUDIO.json'
          manifest=json.loads(receipt.read_text())
          assert manifest['policy_count']==5
          assert manifest['source_original_frames']==80
          assert manifest['all_source_frames_endpoint_piercing_free']
          assert manifest['true_software_Z_buffer']
          assert manifest['native_source_geometry_not_edited']
          assert manifest['gif_sha256']==hashlib.sha256(movie.read_bytes()).hexdigest()
          assert manifest['preview_png_sha256']==hashlib.sha256(preview.read_bytes()).hexdigest()
          assert movie.stat().st_size>100000
          print('PASS actual 5-policy source geometry, same camera and depth-tested GIF')
          PY
      - name: Independently audit all original mesh endpoints AND 7 between-frame linear samples on three five-policy trajectories
        run: |
          set -euo pipefail
          for geometry in 73013 74017 75029; do
            python3 scripts/audit_rbc_subframe_geometry.py \
              --mesh-dir "output/rbc-rounded-clean-80/g${geometry}-mesh" \
              --output "output/rbc-rounded-clean-80/g${geometry}-linear-subframes.json" \
              --subdivisions 8
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("output/rbc-rounded-clean-80")
          reports=[json.loads(x.read_text()) for x in sorted(root.glob("*-linear-subframes.json"))]
          assert len(reports)==3
          assert all(r["source_frame_count"]==80 for r in reports)
          assert all(r["native_policy_count"]==5 for r in reports)
          assert all(r["independent_endpoint_checks"]==80 for r in reports)
          assert all(r["independent_linear_subframe_checks"]==80*7 for r in reports)
          assert all(r["original_initial_configuration_intersecting_pairs"]==0 for r in reports)
          assert all(r["source_endpoint_piercing_total"]==0 for r in reports)
          assert all(r["source_linear_subframe_piercing_total"]==0 for r in reports)
          assert all(len(r["all_five_original_policy_sha256"])==5 for r in reports)
          print("PASS original geometry on 3 sources: 240 exact endpoint audits"
                " and 1680 original linearly interpolated subframe audits;"
                " no measured strict nonlocal piercings")
          PY
      - name: Build real 80-frame five-policy interactive orbit and timeline browser, with embedded SOURCE RECEIPTS
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund \
            three@0.180.0 esbuild@0.25.12
          python3 scripts/build_rbc_physics_viewer.py \
            --mesh-dir output/rbc-rounded-clean-80/g73013-mesh \
            --output output/rbc-rounded-clean-80/FIVE_POLICY_INTERACTIVE_OFFLINE.html \
            --offline
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          root=Path('output/rbc-rounded-clean-80')
          document=(root/'FIVE_POLICY_INTERACTIVE_OFFLINE.html').read_text()
          receipt=json.loads((root/'FIVE_POLICY_INTERACTIVE_OFFLINE.viewer-receipts.json').read_text())
          assert receipt['original_frames']==80
          assert receipt['original_policy_count']==5
          assert receipt['original_total_policy_frames']==400
          assert receipt['viewer_is_self_contained_offline']
          assert not receipt['renderer_requires_network_for_external_library']
          assert '<script type="importmap">' not in document
          assert receipt['all_original_endpoint_intersections_zero']
          assert receipt['all_original_policy_positions_SAP_equal']
          assert receipt['HTML_sha256']==hashlib.sha256(document.encode()).hexdigest()
          payload=re.search(r'<script id="native-evidence" type="application/json">(.*?)</script>',
                            document,re.S)
          assert payload is not None
          data=json.loads(payload.group(1))
          assert data['schema']=='rbc-five-policy-original-native-webgl-v1'
          assert len(data['policies'])==5
          assert all(len(x)==80 for x in data['policies'].values())
          assert all(all(f['metrics']['geometric_self_intersections']==0 for f in x)
                     for x in data['policies'].values())
          native_js=document.rsplit('<script>\\n',1)[1].split('\\n</script>',1)[0]
          Path('/tmp/kyoto-rbc-3d-viewer-syntax.js').write_text(native_js)
          print('PASS original 5-policy 3D browser source data, 400 verified original physics frames and SHA-256 receipt')
          PY
          node --check /tmp/kyoto-rbc-3d-viewer-syntax.js
      - name: Preserve original failure or success source, not fake physics visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbc-independent-exact-endpoint-piercing-3-source-5-policy-80-frames
          path: output/rbc-rounded-clean-80/
          if-no-files-found: warn

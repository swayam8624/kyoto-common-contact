name: Pass 50–52 whole mesh and physical validation
on:
  push:
    branches: [research/pass50-whole-mesh-certificate]
  pull_request:
    paths:
      - 'tools/pass50*'
      - 'tools/pass51*'
      - 'tools/pass52*'
      - 'tools/run50.py'
      - '.github/workflows/pass50-52-physical-validation.yml'
  workflow_dispatch:
jobs:
  physical:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 casadi==3.7.2
      - run: |
          python tools/pass49_adaptive.py adaptive
          python tools/run50.py adaptive replay.json
          python tools/pass50_live.py live
          python tools/pass50_edge_response.py edge
          python tools/pass50_vertex_response.py vertex
          python tools/pass51_convergence.py convergence
          mkdir convergence_inputs
          for f in convergence/scene*.npz; do cp "$f" "convergence_inputs/committed_$(basename "$f")"; done
          python tools/run50.py convergence_inputs convergence_mesh.json
          python - <<'PY'
          import json
          from pathlib import Path
          for f in ('replay.json', 'convergence_mesh.json'):
              rows=json.loads(Path(f).read_text())
              assert rows and all(not r['unresolved'] for r in rows), f
          PY
          python tools/pass52_live_bench.py benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass50-52-${{ matrix.os }}
          path: |
            adaptive/
            replay.json
            live/
            edge/
            vertex/
            convergence/
            convergence_mesh.json
            benchmark/
          if-no-files-found: error

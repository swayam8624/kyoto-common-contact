name: CBP Phase 11 — adversarial global CPU search pressure ladder
on:
  push:
    branches:
      - research/common-broadphase-orchestrator
    paths:
      - 'include/ccp/cbp_pressure.hpp'
      - 'apps/cbp_pressure_cpu.cpp'
      - 'scripts/test_cbp_pressure_cpu.py'
      - '.github/workflows/cbp-phase11-pressure.yml'
      - 'CMakeLists.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  global-pressure:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Build true global 3D exact pressure backends
        run: |
          cmake --preset kyoto-final-cpu
          cmake --build build/kyoto-final-cpu --target ccp_cbp_pressure_cpu --parallel 2
      - name: Six adversarial regimes, independent brute oracles and budget behavior
        run: |
          ctest --test-dir build/kyoto-final-cpu -R '^cbp_adversarial_pressure_oracle$' --output-on-failure
      - name: Run nontrivial 65K global 3D collapse with output-count pressure
        timeout-minutes: 9
        run: |
          mkdir -p build/cbp-pressure-evidence
          build/kyoto-final-cpu/ccp_cbp_pressure_cpu \
            build/cbp-pressure-evidence/burst-65536.csv burst 65536 12 61749 \
            140000000 30000 3000000
          build/kyoto-final-cpu/ccp_cbp_pressure_cpu \
            build/cbp-pressure-evidence/slabs-65536.csv slabs 65536 8 61749 \
            140000000 30000 3000000
          python3 - <<'PY'
          import csv
          from pathlib import Path
          for scene in ('burst','slabs'):
              path=Path('build/cbp-pressure-evidence')/(scene+'-65536.csv')
              rows=list(csv.DictReader(path.open()))
              assert rows and all(int(x['n'])==65536 for x in rows)
              assert any(x['status']=='complete' for x in rows)
              assert all(x['method'] in {'global_3d_hash_grid','global_x_sweep'} for x in rows)
              print('REAL pressure case:',scene,'rows',len(rows))
              for x in rows:
                  if int(x['frame']) in (0,len(rows)//4):
                      print(x['frame'],x['method'],x['status'],
                            'visited',x['tested_pairs'],
                            'exact found',x['exact_pairs'],
                            'ms',x['query_ms'])
          PY
      - name: Upload bounded exactness and unfinished-search receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbp-phase11-actual-global-pressure-65k-cpu
          path: build/cbp-pressure-evidence/*.csv
          retention-days: 14
          if-no-files-found: warn

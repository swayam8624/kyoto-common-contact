name: Gaia independent CPU baseline
on:
  pull_request:
    paths:
      - 'research/gaia-ci/**'
      - '.github/workflows/gaia-independent-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-embree-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Fetch Embree 3.12.2 transitive TBB runtime
        run: |
          sudo apt-get update
          mkdir -p runtime
          cd runtime
          apt-get download libtbb2
      - uses: actions/upload-artifact@v4
        with:
          name: embree-legacy-tbb-runtime
          path: runtime/
  baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev libtbb-dev libembree-dev libomp-dev libboost-dev clang ninja-build
          dpkg-query -W libeigen3-dev libtbb-dev libembree-dev libomp-dev
      - name: Clone exact upstream revisions
        run: |
          git init gaia-upstream
          git -C gaia-upstream remote add origin https://github.com/AnkaChan/Gaia.git
          git -C gaia-upstream fetch --depth 1 origin c229692045465a76233f9fba9197fb22bbfb3694
          git -C gaia-upstream checkout --detach FETCH_HEAD
          git -C gaia-upstream submodule update --init Simulator/3rdParty/CuMatrix Simulator/3rdParty/MeshFrame2
          test "$(git -C gaia-upstream/Simulator/3rdParty/CuMatrix rev-parse HEAD)" = bb2aaefcceee8cf294c8b98648733caa9fb6b22f
          test "$(git -C gaia-upstream/Simulator/3rdParty/MeshFrame2 rev-parse HEAD)" = 6e4bad91f616bb9709d661c16abc01cc792e75c9
      - name: Apply CPU-only patches
        run: |
          mkdir -p receipts
          python3 research/gaia-ci/port_cpu.py gaia-upstream
          git -C gaia-upstream diff > receipts/gaia.patch
          git -C gaia-upstream/Simulator/3rdParty/CuMatrix diff > receipts/cumatrix.patch
          git -C gaia-upstream/Simulator/3rdParty/MeshFrame2 diff > receipts/meshframe.patch
          git -C gaia-upstream submodule status > receipts/submodules.txt
      - name: Export self-contained Linux source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer/gaia/Simulator/3rdParty transfer/packages
          cp -a gaia-upstream/Simulator/Modules transfer/gaia/Simulator/
          cp -a gaia-upstream/Simulator/3rdParty/CuMatrix/CuMatrix transfer/gaia/Simulator/3rdParty/
          mkdir -p transfer/gaia/Simulator/3rdParty/MeshFrame2
          cp -a gaia-upstream/Simulator/3rdParty/MeshFrame2/MeshFrame transfer/gaia/Simulator/3rdParty/MeshFrame2/
          # Restore the CuMatrix directory layout expected by the target.
          mv transfer/gaia/Simulator/3rdParty/CuMatrix transfer/gaia/Simulator/3rdParty/CuMatrix-headers
          mkdir transfer/gaia/Simulator/3rdParty/CuMatrix
          mv transfer/gaia/Simulator/3rdParty/CuMatrix-headers transfer/gaia/Simulator/3rdParty/CuMatrix/CuMatrix
          cp -a research/gaia-ci transfer/harness
          cp -a receipts transfer/receipts
          cd transfer/packages
          for pkg in libeigen3-dev libtbb-dev libtbb12 libtbbmalloc2 libtbbbind-2-5 libembree-dev libembree3-3 libomp-14-dev libomp5-14; do
            if dpkg-query -W "$pkg" >/dev/null 2>&1; then
              apt-get download "$pkg"
            fi
          done
          cd ../..
          tar -czf gaia-linux-source-and-deps.tar.gz transfer
      - uses: actions/upload-artifact@v4
        with:
          name: gaia-linux-source-and-deps
          path: gaia-linux-source-and-deps.tar.gz
      - name: Build original detector
        shell: bash
        run: |
          set -o pipefail
          cmake -S research/gaia-ci -B gaia-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DGAIA_SOURCE="$PWD/gaia-upstream" 2>&1 | tee receipts/configure.log
          cmake --build gaia-build --parallel 2 -- -k 0 2>&1 | tee receipts/build.log
      - name: Execute original callback smoke
        shell: bash
        run: |
          set -o pipefail
          python3 research/gaia-ci/fixtures.py fixtures
          for n in 4 8 12; do
            for sim in 1 2; do
              gaia-build/gaia_probe "fixtures/grid${n}_0.obj" "fixtures/grid${n}_1.obj" "$sim" 2>&1 | tee "receipts/grid${n}_sim${sim}.log"
            done
          done
      - name: Verify frozen source and patch original detector
        run: |
          cd research/gaia-ci
          test "$(git hash-object frozen/external.hpp)" = 1bb7e384ae5922ad77d42d907009b431fb8132ae
          test "$(git hash-object frozen/feature_pairs.hpp)" = 88f677e85e0e5be4ed04bf225cfd650787a3f99d
          test "$(git hash-object frozen/selector.cpp)" = a8860282df55a2d2c3443f4d3b8a0df0a658254a
          test "$(git hash-object frozen/tree.hpp)" = ca213be15f4390bdffe379bf13ed09c37eb6d759
          test "$(git hash-object gaia_bridge.hpp)" = 996a030925aad0cefc93ac6a3528527eb654d38d
          test "$(git hash-object gaia_probe.inc)" = 73b0ce25bafee173d6a6b7df26eb337287e42bed
          python3 prepare_gaia.py ../../gaia-upstream
      - name: Build frozen selector and actual callback comparison
        shell: bash
        run: |
          set -o pipefail
          cmake -S research/gaia-ci -B gaia-compare -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DGAIA_SOURCE="$PWD/gaia-upstream" -DKYOTO_COMPARE=ON 2>&1 | tee receipts/compare-configure.log
          cmake --build gaia-compare --parallel 2 -- -k 0 2>&1 | tee receipts/compare-build.log
      - name: Strict original versus modified Gaia
        shell: bash
        run: |
          set -o pipefail
          export KYOTO_SELECTOR_LIBRARY="$PWD/gaia-compare/libkyoto_selector.so"
          failed=0
          for n in 4 8 12; do
            for sim in 1 2; do
              gaia-compare/gaia_probe "fixtures/grid${n}_0.obj" "fixtures/grid${n}_1.obj" "$sim" "receipts/compare_grid${n}_sim${sim}" 2>&1 | tee "receipts/compare_grid${n}_sim${sim}.log" || failed=1
            done
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gaia-baseline-receipts
          path: receipts/

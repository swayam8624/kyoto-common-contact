name: Kyoto scaling references
on:
  push:
    branches:
      - research/kyoto-scale-evidence
  pull_request:
    paths:
      - 'apps/scaling_cpu.cpp'
      - 'apps/scaling_metal.mm'
      - '.github/workflows/kyoto-scaling.yml'

jobs:
  cpu-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile CPU benchmark with warnings
        run: |
          c++ -std=c++23 -O2 -Wall -Wextra -Wpedantic -pthread \
            apps/scaling_cpu.cpp -o /tmp/ccp_scaling_cpu
      - name: Compile certified regional benchmark against real solver core
        run: |
          c++ -std=c++23 -O2 -Wall -Wextra -Wpedantic -pthread -Iinclude \
            apps/scaling_regional.cpp src/research_multicloth.cpp \
            src/online_partitioner.cpp src/live_cloth.cpp -o /tmp/ccp_scaling_regional
      - name: Oracle regression tests
        run: /tmp/ccp_scaling_cpu --self-test
      - name: Run real regional certified benchmark
        run: |
          /tmp/ccp_scaling_regional /tmp/regional.csv 256 4 hotspot 1234 0.6 hierarchical
          python3 - <<'PY'
          import csv
          with open('/tmp/regional.csv', newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==4
          assert all(r['backend']=='cpu_region_hierarchical' for r in rows)
          assert all(int(r['misses'])==0 for r in rows)
          print('Certified region benchmark CSV PASS')
          PY
      - name: Smoke benchmark
        run: |
          /tmp/ccp_scaling_cpu /tmp/cpu.csv 256 3 4 hotspot 1234
          python3 - <<'PY'
          import csv
          with open('/tmp/cpu.csv', newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==12, rows
          assert {r['backend'] for r in rows}=={'cpu_sap_serial','cpu_sap_threaded','cpu_sap_work_aware','cpu_sap_auto'}
          assert all(int(r['misses'])==0 for r in rows)
          assert all(int(r['candidates'])>=0 for r in rows)
          print('CPU benchmark CSV PASS')
          PY
      - name: Run repeatable exploratory CPU scaling matrix
        run: |
          mkdir -p /tmp/kyoto-executables
          cp /tmp/ccp_scaling_cpu /tmp/ccp_scaling_regional /tmp/kyoto-executables/
          python3 scripts/run_scaling_matrix.py \
            --build /tmp/kyoto-executables \
            --output /tmp/kyoto-evidence \
            --methods cpu regional-fixed regional-adaptive regional-hier \
            --scenes hotspot cluster \
            --sizes 256 512 \
            --frames 8 --repeats 3 --threads 4 --seed 1234
      - name: Preserve immutable experimental evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-linux-cpu-exploratory
          path: /tmp/kyoto-evidence/
          retention-days: 30
          if-no-files-found: warn
  metal-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile Apple Metal objective-C++ benchmark
        run: |
          xcrun clang++ -std=c++23 -O2 -fobjc-arc -Wall -Wextra -Wpedantic \
            apps/scaling_metal.mm -framework Foundation -framework Metal \
            -o /tmp/ccp_scaling_metal
      - name: GPU runtime environment
        run: |
          system_profiler SPDisplaysDataType || true
          # The hosted runner may not expose a compute-capable Metal device.
          # Compilation is a required gate; real GPU measurements must be run
          # on an identified physical GPU and preserved as raw CSV + metadata.
